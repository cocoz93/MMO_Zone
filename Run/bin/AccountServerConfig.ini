; 계정 서버 설정. 서버 간 주소는 ServerLink.ini
[Server]
; 웹 포트. 중계(relay.js)는 9002 에서 이 포트로 잇는다
Port=6200
; 지표 포트. 9091 프로메테우스, 9092 에코 더미, 9094 그라파나와 겹치지 않게 고른 값
MonitorPort=9095
MaxClients=1000
WorkerThreads=2
LogicPeriodMs=10

[DB]
; [보안] MMOServerConfig.ini 와 같이 일단 평문. 이 계정은 127.0.0.1 에서만 접속된다
Host=127.0.0.1
Port=3306
User=account_server
Password=F7mzcKfinrMPcaSVj4iwh_Jh
Database=accountdb
Workers=2
QueueMax=1000
ConnectTimeoutSec=3
RwTimeoutSec=5

[Account]
; 로그인 토큰 유효 시간(초). 2분으로 시작하고 mmo_auth_token_total{result="expired"} 가 쌓이면 300 으로 올린다
AuthTokenTtlSec=120
; 이름만으로 로그인하고 없는 이름은 계정을 새로 만든다. 끄면 거절. 로그인 서버가 붙으면 끈다
AllowDevLogin=1
