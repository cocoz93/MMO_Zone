[Server]
IP=127.0.0.1
Port=6000

[Account]
; 입장 요청에 실어 보낼 계정 번호
; 0        = 번호 미지정. 서버가 접속마다 새로 붙인다 (매번 새 캐릭터)
; 2^31 이상 = 지정 번호. 같은 번호로 들어오면 저장된 자리에서 다시 시작한다
;            서버 자동 번호는 int32 카운터라 이 구간까지 못 올라온다
Id=10000000000
