; 캐릭터 서버 설정. 서버 간 주소는 ServerLink.ini
[Server]
; 웹 포트. 중계(relay.js)는 9001 에서 이 포트로 잇는다
Port=6100
; 지표 포트. 9091 프로메테우스, 9092 에코 더미, 9094 그라파나, 9095 계정 서버와 겹치지 않게 고른 값
MonitorPort=9093
MaxClients=1000
WorkerThreads=2
LogicPeriodMs=10

[DB]
; [보안] MMOServerConfig.ini 와 같이 일단 평문. 이 계정은 127.0.0.1 에서만 접속된다
Host=127.0.0.1
Port=3306
User=character_server
; 암호는 이 파일에 두지 않는다 ? PasswordFile 이 가리키는 파일에 있다(git 무시). 없으면 DbPassword.local.ini.example 을 보고 만든다
PasswordFile=DbPassword.local.ini
Database=gamedb
Workers=2
QueueMax=1000
ConnectTimeoutSec=3
RwTimeoutSec=5

[Character]
; 계정당 캐릭터 칸 수
CharacterSlots=4
; 삭제 유예(일). 지나면 자리가 풀리고 복구가 막힌다
DeleteGraceDays=7
