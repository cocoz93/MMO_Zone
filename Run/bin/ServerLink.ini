[Account]
; 계정 서버 내부 포트. 캐릭터 서버가 여기로 접속한다
InternalAddr=127.0.0.1:6201

[Character]
; 캐릭터 서버 내부 포트. 존 서버가 여기로 접속한다
InternalAddr=127.0.0.1:6101

[Link]
; 다시 접속 주기(초)
RetrySec=3
; 하트비트 주기(초). 코어 세션 시한 60초의 3분의 1
HeartbeatSec=20
; 위층 응답 시한(초)
ReplyTimeoutSec=3
; 세션 표에 서버 간 연결 몫으로 더하는 칸
SessionReserve=8
