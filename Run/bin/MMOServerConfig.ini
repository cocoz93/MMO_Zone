; ===========================================
; IOCP MMO Server 설정 파일
; ===========================================

[Server]
; GameServer / NetWorkLib_EchoTest / GameCodiEchoTest
Mode=GameServer
Port=6000
MaxClients=6000
MonitorPort=9090
MonitorEnabled=1

; 서버가 쓸 물리코어 범위 (HT 형제 자동 포함). 빈칸=미적용. 예 0-5=물리 6코어
ServerCores=0-5
; 게임루프 전용 코어 격리 (실험용). 빈칸=off. 예 0=게임루프를 물리코어0에 고정, 나머지 I/O는 ServerCores의 남은 코어로
GameCore=

; IOCP 워커 스레드 (0 = 자동: 서버 affinity 코어 수) / WTxK 스윕 실측 결과 4 채택.
; WT4+K4 금지는 '멤버십 묶음(P1/P2)·수신섹터 묶음 이전' C4000 스윕에서 관측(tick p99 200 상한, 왕복 688ms).
;   이후 K 재스윕 2회(C5000)에서 재현 안 됨 - contention 0, tick p99 39.7. 소멸 원인은 미분리
;   (digest A/B는 K2에서만 돌려 인과 미확정). C5500 이상 K4는 미측정.
WorkerThreads=4

; 송신 워커 (0/1 = 단일, 2+ = uniqueId%K 워커 풀)
SendWorkers=3

; RIO 전송 워커 수 (USE_RIO_TRANSPORT=1 빌드 전용, 0=자동 2)
RioWorkers=4
CompletionBatch=0

; 세션당 동시 송신 제출 상한 (양팔 공통). 1=기존 1-pending.
; 2의 거듭제곱만 유효(1/2/4/8) ? 그 외 값은 서버가 아래쪽으로 내린다.
SendDepth=1

; 게임 이벤트 큐(Worker->Game)가 이 길이를 넘으면 신규 accept 거절 (0=off)
; 60000 = 한 틱 유입 추정 3000의 20배 = 게임루프가 20틱(0.8초) 밀린 상태
; 기준 3000은 추정값 - mmo_event_queue_size 관측 후 재설정할 것
EventQueueAcceptLimit=60000
MapCount=1

; -------------------------------------------
; 기본 설정 (개별 [MapN] 섹션이 없으면 이 값을 사용)
; -------------------------------------------

[MapDefault]
Width=120
Height=120
SectorSize=20
MaxPlayersPerChannel=10000

; -------------------------------------------
; 개별 맵 오버라이드 (필요한 맵만 작성)
; -------------------------------------------
; [Map1]
; Width=600
; Height=600

[DB]
; DB 저장 파이프라인 (USE_DB_WORKER).
; [보안] DB 비번은 원칙상 분리 저장하지만, 클라우드 실험·편의 위해 일단 평문 유지
Host=127.0.0.1
Port=3306
User=game_server
Password=game_server
Database=gamedb
Workers=1
SavePeriodSec=60
ConnectTimeoutSec=3
RwTimeoutSec=5
QueueMax=20000

[Game]
PlayerSpeed=7
