<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  @font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2');
    font-weight:100 900;font-style:normal;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:840px;height:580px;overflow:hidden;background:#ffffff;
    font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
  svg{display:block}
  text{font-family:'Pretendard',"Malgun Gothic","Noto Sans KR",sans-serif;fill:#111111}
  .lane{font-size:14px;font-weight:800}
  .h{font-size:14.5px;font-weight:700}
  .s{font-size:12.5px;font-weight:500;fill:#444444}
  .cap{font-size:12px;font-weight:500;fill:#666666}
  .code{font-family:Consolas,"Courier New",monospace;font-size:12px;fill:#111111}
  .r{fill:#c00000}
</style>
</head>
<body>
<svg width="840" height="580" viewBox="0 0 840 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ar" viewBox="0 0 12 12" markerWidth="9" markerHeight="9" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1.2 L10,6 L0,10.8 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="40" y="38" font-size="19" font-weight="800">같은 틱에 섹터를 넘은 사람 — 지우기를 <tspan class="r">따로</tspan> 보낸다</text>
  <text class="s" x="40" y="64">섹터 등록은 틱 1단계에서 그 자리에서 바뀌고, 이탈 알림은 틱 3단계에 몰아서 한다. 그 사이에 줍기가 끼면 한 사람이 빠진다</text>

  <!-- ══════ 섹터 네 칸 ══════ -->
  <text class="lane" x="40" y="104">자리 — 섹터 가로 넷 (한 칸 20타일, 시야 = 내 섹터와 이웃 섹터)</text>

  <rect x="40"  y="116" width="150" height="64" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <rect x="190" y="116" width="150" height="64" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <rect x="340" y="116" width="150" height="64" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <rect x="490" y="116" width="150" height="64" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="cap" x="50"  y="133">섹터 0</text>
  <text class="cap" x="200" y="133">섹터 1</text>
  <text class="cap" x="350" y="133">섹터 2</text>
  <text class="cap" x="500" y="133">섹터 3</text>

  <!-- 아이템 · B (섹터 0) -->
  <rect x="112" y="146" width="18" height="18" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="cap" x="136" y="160">아이템</text>
  <rect x="58" y="143" width="34" height="24" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="h" x="75" y="160" text-anchor="middle">B</text>

  <!-- A (섹터 1 → 섹터 2) -->
  <rect x="290" y="143" width="34" height="24" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="h" x="307" y="160" text-anchor="middle">A</text>
  <line x1="324" y1="155" x2="354" y2="155" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="356" y="143" width="34" height="24" fill="#ffffff" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="h" x="373" y="160" text-anchor="middle">A</text>
  <text class="cap" x="398" y="160">0.6칸</text>

  <!-- 시야 두 줄 -->
  <line x1="40" y1="200" x2="490" y2="200" stroke="#333333" stroke-width="1.2"/>
  <line x1="40" y1="194" x2="40" y2="206" stroke="#333333" stroke-width="1.2"/>
  <line x1="490" y1="194" x2="490" y2="206" stroke="#333333" stroke-width="1.2"/>
  <text class="s" x="500" y="204">A 가 섹터 1 일 때 보이는 곳 — 아이템 <tspan font-weight="700" fill="#111111">보임</tspan></text>

  <line x1="190" y1="226" x2="640" y2="226" stroke="#333333" stroke-width="1.2"/>
  <line x1="190" y1="220" x2="190" y2="232" stroke="#333333" stroke-width="1.2"/>
  <line x1="640" y1="220" x2="640" y2="232" stroke="#333333" stroke-width="1.2"/>
  <text class="s" x="650" y="230">섹터 2 — <tspan font-weight="700" fill="#111111">안 보임</tspan></text>

  <!-- ══════ 한 틱 안의 차례 ══════ -->
  <text class="lane" x="40" y="276">차례 — 한 틱 안</text>
  <text class="cap" x="40"  y="298">틱 1단계 · 네트워크 이벤트</text>
  <text class="cap" x="580" y="298">틱 3단계 · 섹터 변경 알림</text>
  <line x1="560" y1="286" x2="560" y2="424" stroke="#333333" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- ① -->
  <rect x="40" y="308" width="480" height="50" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="h" x="56" y="329">① A 가 MOVE_START — 섹터 등록이 1 → 2 로 그 자리에서 바뀐다</text>
  <text class="cap" x="56" y="347">A 의 화면은 아직 섹터 1 기준 — 아이템이 떠 있다. 알림은 대기열에 넣고 틱 끝에</text>

  <!-- ② -->
  <rect x="40" y="370" width="480" height="54" fill="#ffffff" stroke="#c00000" stroke-width="1.6"/>
  <text class="h" x="56" y="391">② B 가 Z — 지금 등록 기준 주변에 DELETE(PICKED)</text>
  <text class="cap r" x="56" y="410">A 는 이미 섹터 2 로 등록 — 받는 사람에서 빠진다</text>

  <!-- ③ -->
  <line x1="520" y1="333" x2="578" y2="333" stroke="#333333" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="580" y="308" width="220" height="116" fill="#ffffff" stroke="#c00000" stroke-width="1.6"/>
  <text class="h" x="596" y="329">③ A 의 이탈 처리</text>
  <text class="cap" x="596" y="349">이탈한 섹터 0 의 아이템마다</text>
  <text class="cap" x="596" y="366">DELETE(OUT_OF_SIGHT)</text>
  <text class="cap r" x="596" y="390">아이템은 ② 에서 이미 빠졌다</text>
  <text class="cap r" x="596" y="407">→ 보낼 것이 없다</text>

  <!-- 보정 -->
  <rect x="40" y="448" width="760" height="76" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
  <text class="h" x="56" y="471">보정 — ② 의 OnGroundItemGone 이 섹터 변경 대기열을 한 번 더 본다</text>
  <text class="cap" x="56" y="492">옛 섹터로는 아이템이 보였고 새 섹터로는 안 보이는 이동자에게 같은 DELETE 를 따로 보낸다</text>
  <text class="code" x="56" y="512">SendGroundItemDeleteToLateMovers</text>
  <text class="cap" x="276" y="512">— 대기열이 차 있는 틱 1단계(줍기)에서만 돈다</text>

  <text class="s" x="40" y="558"><tspan font-weight="700" fill="#111111">빨강 = 보정이 없으면 A 에게 안 가는 알림</tspan> — A 화면에 아이템이 남고, 주우려 하면 NO_ITEM 이 온다</text>
</svg>
</body>
</html>
