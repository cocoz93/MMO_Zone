  <text class="cap" x="40" y="580">빨강 = 예로 든 칸 하나 (3, 2) = _sectors[15] — 칸 36개가 전부 이 꼴 · ② 의 화살표 = 벡터 칸이 본체를 가리키는 주소(포인터)</text>
</svg>

<script>
// ① 칸 번호 36개(15번은 마크업에서 빨강으로 따로) · ② _sectors 한 줄 10칸(5번째가 15번)
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  function txt(x, y, cls, s, anchor) {
    var t = document.createElementNS(NS, 'text');
    t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('class', cls);
    t.setAttribute('text-anchor', anchor || 'middle'); t.textContent = s; return t;
  }
  var cells = document.getElementById('cells');
  for (var j = 0; j < 6; j++) for (var i = 0; i < 6; i++) {
    var n = j * 6 + i; if (n === 15) continue;
    cells.appendChild(txt(60 + i * 40 + 20, 108 + j * 40 + 24, 'idx', String(n)));
  }
  var strip = document.getElementById('strip');
  var labels = ['0', '1', '2', '…', '14', '15', '16', '…', '34', '35'];
  for (var k = 0; k < labels.length; k++) {
    var x = 411 + k * 38, red = (labels[k] === '15');
    var r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', x); r.setAttribute('y', 108); r.setAttribute('width', 38); r.setAttribute('height', 36);
    r.setAttribute('fill', '#ffffff'); r.setAttribute('stroke', red ? '#c00000' : '#333333'); r.setAttribute('stroke-width', red ? 2 : 1.2);
    strip.appendChild(r);
    var t = txt(x + 19, 131, red ? 's r' : 's', labels[k]);
    if (red) t.setAttribute('font-weight', 800);
    strip.appendChild(t);
  }
})();
</script>
</body>
</html>
