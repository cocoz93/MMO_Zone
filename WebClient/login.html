<!doctype html><html><head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMO — 로그인</title>
<link rel="stylesheet" href="lobby.css">
</head>
<body>
<div class="center">
  <form class="panel login" id="form" autocomplete="off">
    <h1>로그인</h1>
    <p class="sub">이름 하나로 들어갑니다. 처음 쓰는 이름이면 계정이 새로 생깁니다</p>
    <input id="name" class="text" maxlength="16" placeholder="영문 · 숫자 4~16자" autofocus>
    <button id="go" class="btn gold" type="submit">들어가기</button>
    <p id="msg" class="msg"></p>
  </form>
</div>
<script src="proto-lobby.js"></script>
<script>
(()=>{
const L = window.LobbyProto;
const q = new URLSearchParams(location.search);
// 계정 서버 주소 — live.html 의 ?ws= 와 같은 꼴. 존 서버 주소는 고르기 답에서 받는다
const ACCOUNT_WS = q.get('accountWs') || 'ws://127.0.0.1:9002';
const $ = id => document.getElementById(id);
const FAIL_TEXT = {
  BAD_FORM: '이름은 영문 · 숫자 4~16자입니다',
  LOGIN_DISABLED: '지금은 이 길로 로그인할 수 없습니다',
  BUSY: '서버가 바쁩니다. 잠시 뒤 다시 눌러 주세요',
  DB_FAIL: '서버가 잠시 저장소를 못 읽었습니다. 다시 눌러 주세요',
  NO_SERVER: '계정 서버에 닿지 못했습니다',
};
// 헤드리스 시험이 읽는 표지
const mark = (state, detail) => document.documentElement.setAttribute('data-login', JSON.stringify({ state, detail: detail || '' }));
let busy = false;

// 다음 창에 주소 인자를 그대로 넘긴다(?accountWs · ?charWs). 시험용 ?name 만 뺀다
function nextUrl() { const p = new URLSearchParams(location.search); p.delete('name'); const s = p.toString(); return 'character.html' + (s ? '?' + s : ''); }

async function submit(name) {
  if (busy) return;
  if (!L.isValidLoginName(name)) { $('msg').textContent = FAIL_TEXT.BAD_FORM; mark('bad_form'); return; }
  busy = true; $('go').disabled = true; $('msg').textContent = '';
  mark('asking');
  const out = await L.fetchToken(ACCOUNT_WS, name);
  busy = false; $('go').disabled = false;
  if (out.result !== 'OK') { $('msg').textContent = FAIL_TEXT[out.result] || out.result; mark('failed', out.result); return; }
  sessionStorage.setItem(L.STORE.loginName, name);
  sessionStorage.setItem(L.STORE.authToken, out.token);
  mark('ok');
  location.replace(nextUrl());
}
$('form').addEventListener('submit', e => { e.preventDefault(); submit($('name').value.trim()); });
mark('ready');
if (q.get('name')) { $('name').value = q.get('name'); submit(q.get('name')); }   // 시험 대본은 입력을 건너뛴다
})();
</script>
</body></html>
