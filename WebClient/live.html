<!doctype html><html><head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MMO 웹 클라이언트 — 실서버 접속 (LIVE)</title>
<style>
  html,body{margin:0;background:#12211a;font-family:system-ui,"Malgun Gothic",sans-serif;color:#e7f0e7}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#2f5a3a}
  canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:pointer}
  .conn{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:5;box-sizing:border-box;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:13px;padding:6px 14px;border-radius:20px;background:rgba(8,14,10,.8);border:1px solid rgba(255,255,255,.12)}
  .conn.ok{color:#8fe6a2;border-color:rgba(120,220,150,.4)}
  .conn.bad{color:#e88;border-color:rgba(220,120,120,.4)}
  .chatbox{position:absolute;left:14px;bottom:14px;width:400px;height:32px;z-index:6;
    background:rgba(10,16,12,.82);border:1px solid rgba(150,200,150,.25);border-radius:8px;
    color:#eaf3e0;font:13px system-ui,"Malgun Gothic",sans-serif;padding:0 12px;outline:none;text-overflow:ellipsis}
  .chatbox:focus{border-color:rgba(120,220,150,.6);background:rgba(12,20,14,.96)}
  .chatbox::placeholder{color:rgba(200,220,200,.4)}
</style>
</head>
<body>
<div class="stage"><canvas id="v"></canvas><div class="conn" id="conn">연결 중…</div>
<input id="chatbox" class="chatbox" maxlength="200" autocomplete="off" placeholder="Enter로 채팅 입력 · WASD로 이동 · Space로 공격"></div>
<script src="proto.js"></script>
<script src="assets/assetsB.js"></script>
<script src="assets/lpc_layers.js"></script>
<script src="assets/monsters.js"></script>
<script src="assets/items.js"></script>
<script src="assets/town.js"></script>
<script>
(()=>{
"use strict";
const P = window.Proto;
const cv = document.getElementById('v'), ctx = cv.getContext('2d');
const connEl = document.getElementById('conn');
const chatbox = document.getElementById('chatbox');
function typing(){ return document.activeElement===chatbox; }
const SANS = 'system-ui,"Malgun Gothic",sans-serif';
const MONO = 'ui-monospace,Consolas,monospace';
const q = new URLSearchParams(location.search);
const SNAP = q.has('snap');                 // headless verify: render one frame from snapshot.json
const WS_URL = q.get('ws') || 'ws://127.0.0.1:9000';
// ?account=N — 지정 계정 번호로 입장한다(같은 번호면 저장된 자리에서 다시 시작).
//   N 은 2^31(2147483648) 이상이어야 한다 — 그 미만(0 제외)은 서버가 입장 요청에서 끊는다(자동 번호 구간).
//   없으면 0 = "번호를 지정하지 않음" → 서버가 매번 새 번호를 붙인다(탭을 여럿 열어도 안 겹친다).
//   숫자만 남긴다 — BigInt() 는 숫자 아닌 글자에 예외를 던진다. 그게 onopen 안에서 터지면
//   소켓은 열린 채로 입장 요청만 안 나가서, 화면은 "연결 안 됨"인데 캐릭터도 영영 안 생긴다.
const ACCOUNT = (q.get('account') || '0').replace(/[^0-9]/g, '') || '0';

// ---- assets ----
const IMG = {};

// ---- world / camera ----
let ZONE = { mapId:-1, channel:0, mapWidth:120, mapHeight:120, sectorSize:20 };   // S2C_ZONE_INFO 가 덮는다(접속·존 이동·마을 부활마다)
let ZOOM = 20;                              // px per world unit
// 게임 화면 = 캔버스 가운데의 정사각형, 한 변 VIEW_ROWS 칸(기본 30) — 창 크기·브라우저 확대와 상관없이 같은 넓이를 본다.
//   서버의 유효범위(내 섹터 ±1)는 정사각형이고, 섹터 끝에 서 있으면 그쪽으로는 섹터 한 칸(기본 20)만 받는다.
//   그래서 화면 절반이 섹터 한 칸보다 작아야 화면 끝이 비지 않는다 — 30칸이면 절반 15 < 섹터 20 (유효범위 60 = 화면의 2배).
//   창 전체를 게임 화면으로 쓰면 가로가 62~96칸이 되어 유효범위 60칸을 넘는다 — 좌우 끝에 서버가 안 알려 주는 구역이 생긴다.
//   서버 값을 화면에 맞춰 키우는 대신(섹터 32·맵 128까지 가 봤다) 화면을 서버 값에 맞춘 것이다.
//   기본 30칸 = 사용자가 확대 150%에서 보던 세로 넓이(약 31칸)이고, 캐릭터 키는 화면 높이의 약 8%다.
//   창이 가로로 길면 좌우가 여백으로 남고 HUD(이름표·채팅·서버 정보·레이더)가 거기 놓인다.
//   ?rows=N 한 변 칸 수 · ?wide 창 전체를 게임 화면으로(세로 N칸 고정) · ?rows=0 예전처럼 1칸 20px 고정(창 전체)
const VIEW_ROWS = q.has('rows') ? Math.max(0, Number(q.get('rows')) || 0) : 30;
const VIEW_WIDE = q.has('wide');
let W=0,H=0,DPR=1;
let VX=0,VY=0,VW=0,VH=0;                    // 게임 화면(월드가 그려지는 영역) — 캔버스 px. 그 바깥은 여백
let CHAT_W=400;                             // 채팅 패널·입력창 폭 — 왼쪽 여백이 좁으면 거기에 맞춰 줄인다
function resize(){
  DPR=Math.min(2,devicePixelRatio||1);
  const r=cv.getBoundingClientRect();
  W=Math.round(r.width)||innerWidth; H=Math.round(r.height)||innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  if (VIEW_WIDE || VIEW_ROWS < 8) { VX=0; VY=0; VW=W; VH=H; }                       // 창 전체
  else { VW=VH=Math.min(W,H); VX=Math.round((W-VW)/2); VY=Math.round((H-VH)/2); }   // 가운데 정사각형
  if (VIEW_ROWS >= 8) ZOOM = VH / VIEW_ROWS;      // 8칸 미만은 받지 않는다(너무 확대돼 조작이 안 된다)
  // 왼쪽 여백에 패널 하나는 들어가는데(250px) 400px 에는 못 미치면 채팅을 여백 폭으로 줄인다.
  //   여백이 그보다 좁으면(세로로 긴 창 등) 예전처럼 게임 화면 위에 400px 로 얹는다.
  CHAT_W = (VX>=250 && VX<428) ? VX-28 : 400;
  chatbox.style.width = (CHAT_W-26)+'px';         // 입력창을 패널과 같은 폭으로(좌우 패딩 12×2 + 테두리 1×2 를 뺀다)
  // 연결 표시 — 왼쪽 여백이 있으면 이름표 아래로 옮긴다. 위 가운데에 두면 작아진 게임 화면의 윗부분을 가린다
  //   (확대 150%에서 화면 폭의 40%를 덮었다). 여백이 없으면 예전처럼 위 가운데.
  //   ★ 110px = 이름표가 경험치 칸까지 낀 높이(14+84=98) + 12px 틈. 84px 는 칸이 없던 시절 값이라
  //     레벨이 들어온 순간 8px 겹쳤다. 칸이 뜨기 전 잠깐 틈이 넓은 편이 겹치는 것보다 낫다.
  const side = VX>=250;
  connEl.style.left      = side ? '14px' : '';
  connEl.style.top       = side ? '110px' : '';
  connEl.style.transform = side ? 'none' : '';
  connEl.style.maxWidth  = side ? (VX-28)+'px' : '';
}
new ResizeObserver(resize).observe(cv); resize();

// ---- state (fed by the real server) ----
let self = null;                            // {id,x,y,dir,moveState,disp,color,speed, rx,ry}
const others = new Map();                   // id -> {x,y,dir,moveState,disp,color, rx,ry, chat,chatT}
const chatLog = [];                         // {disp,msg}
const BUBBLE_LIFE = 7;                       // 말풍선 표시 시간(초) — 캐릭터별 1개(전역 큐 없음)
// 전투 표시 시간(초). 서버 쿨타임이 0.48초라 휘두름은 그보다 짧아야 연타가 끊겨 보인다.
const HIT_LIFE = 0.5;                        // 피격 점멸 + 데미지 숫자
const SWING_LIFE = 0.18;                     // 휘두르는 호
const SKILL_HIT_LIFE = 0.5;                  // 스킬에 맞은 상대 발밑 표시(피격 점멸과 같은 길이)
const CAST_LIFE = 0.3;                       // 범위 스킬(target=shape) 칸 깔기 — 맞는 칸을 잠깐 붉게 · 자신(target=self) 시전은 발밑 푸른 고리
const SPAWN_LIFE = 0.6;                      // 부활 섬광
const FADE_LIFE = 0.5;                       // 죽은 채로 지워진 상대가 흐려지며 사라지는 시간(초)
const LEVELUP_LIFE = 1.6;                    // 레벨업 문구 표시 시간(초)
// 경험치·레벨 (USE_EXP) — 본인 것만 서버가 보낸다. self 에 안 넣는 이유는 self 가
//   존을 넘을 때 통째로 새로 만들어져서 레벨이 같이 날아가기 때문이다(서버가 다시 보내 주긴 한다).
//   level===null = "아직 한 장도 못 받음" → HUD 에 레벨 줄을 안 그린다.
//   공격력·방어력(attack·defense)도 여기 — 서버가 보낸 최종값(S2C_MY_STATS, 레벨 표 + 착용 장비 → 지속 효과 배수)을 그대로 쓴다. 효과(버프)는 내 액터(self.buffs)에.
//     클라는 합을 셈하지 않는다(판정은 서버). null = 아직 한 장도 못 받음 → 상태창에 「—」.
const me = { level:null, exp:0, base:0, next:0, levelUpT:0, attack:null, defense:null };
// 가방 (USE_INVENTORY) — 본인 것만 온다. self 밖에 두는 이유는 me 와 같다(존을 넘을 때 self 가 새로 만들어진다).
//   slots: 칸 번호 -> {id, c}. 서버가 보낸 칸의 "최종값"을 그대로 담는다 — 넣고 빼는 규칙은 클라가 모른다(판정은 서버).
const bag = { slots:new Map(), open:false, tab:1, hover:null };
const INV_TAB_NAMES = ['장비','소비','기타'];                           // P.INV_TAB_RANGES 순서
const INV_TAB_FILE  = new Map([['equip',0],['use',1],['etc',2]]);       // 아이템 표의 tab 글자 → 탭 번호
// 아이템 표 — 서버와 같은 파일(Run/bin/ItemTable.csv)을 serve.js 의 /data/ItemTable.csv 로 받는다(두 벌로 적지 않는다).
//   못 받으면(다른 정적 서버로 열었을 때 등) ITEMS 가 비고, 칸에는 그림 대신 아이템 번호를 회색으로 쓴다.
//   판정은 서버라 그래도 동작은 안 막힌다.
const ITEMS = new Map();                                                // itemId -> {name, tab, maxStack, healHp, icon, attack, healMp}
let ITEM_SHEET = null;                                                  // assets/items.js 의 그림 시트 — 없으면 null(번호로 그린다)
// 스킬 표 (USE_SKILL) — 서버와 같은 파일(Run/bin/SkillTable.csv)을 serve.js 의 /data/SkillTable.csv 로 받는다(아이템 표와 같은 꼴).
//   못 받으면 SKILLS 가 비고 스킬 막대가 안 그려진다 — 숫자 키는 그래도 보낸다(판정은 서버).
const SKILLS = new Map();                                               // skillId -> {name, target, effect, costHpPct, power, cooldownMs, costMp, shape:[[앞,옆],…], durationMs, user}
// 표에는 사람이 쓰는 줄(user=player)과 몬스터(보스)가 쓰는 줄(user=monster)이 같이 있다. 몬스터 줄은 **몬스터 시전의 칸·고리 그림**(S2C_SKILL_CAST)을 그리는 데만 쓰고
//   스킬 막대·숫자 키에는 안 낸다 — 사람이 부르면 서버가 BAD_SKILL 로 거절한다(NOT_FOR_CASTER). user 칸이 없는 옛 줄은 player.
const isMonsterSkill = id => { const s=SKILLS.get(id); return !!s && s.user==='monster'; };
const playerSkillIds = () => [...SKILLS.keys()].filter(id=>!isMonsterSkill(id)).sort((a,b)=>a-b);
// 내 스킬 쿨타임 — 자기 SKILL_CAST 를 받은 순간부터 표의 cooldownMs 를 센다. skillId -> 끝나는 시각(ms)
//   입장·존 이동 때는 서버가 아직 돌고 있는 쿨타임을 S2C_SKILL_COOLDOWN_REMAIN 으로 준다(다시 접속하면 DB 에서 되살린 값) — 그걸로 덮는다.
const skillReadyAt = new Map();
const skillState = { casts:0, lastFail:null };                          // 헤드리스 검증용 셈
// buffs = 내 지속 효과 [종류, 배수, 남은 ms] — S2C_ACTOR_BUFF 가 바꾼다(self.buffs). 값은 서버가 보낸 그대로(remainMs 를 받은 시각부터 깎는다)
function skillChanged(){ document.documentElement.setAttribute('data-skill', JSON.stringify({ skills:playerSkillIds().length, monsterSkills:SKILLS.size-playerSkillIds().length, casts:skillState.casts, lastFail:skillState.lastFail,
  buffs: self && self.buffs ? [...self.buffs].map(([k,b])=>[k, b.value, Math.max(0, Math.round(b.until-performance.now()))]) : [],
  cooldowns: [...skillReadyAt].map(([id,t])=>[id, Math.max(0, Math.round(t-performance.now()))]).filter(c=>c[1]>0) })); }   // [스킬 번호, 남은 ms]
// 스킬 거절 사유(P.SKILL_FAIL 이름) → 채팅 칸 [System] 문구. 거절이면 체력·마력·쿨타임이 그대로다(서버는 모든 검사 뒤에만 뗀다)
const SKILL_FAIL_TEXT = {
  BAD_SKILL:'없는 스킬입니다', DEAD:'쓰러진 동안에는 쓸 수 없습니다', COOLDOWN:'아직 쓸 수 없습니다 — 잠시 뒤에 다시',
  LOW_HP:'체력이 모자랍니다 — 스킬로는 쓰러지지 않습니다', NO_TARGET:'앞에 맞을 몬스터가 없습니다',
  LOW_MP:'마력이 부족합니다',
};
// 맵 표·포털 표 — 서버와 같은 파일(Run/bin/MapTable.csv · PortalTable.csv)을 serve.js 의 /data 로 받는다(아이템·스킬 표와 같은 꼴).
//   맵 표는 땅 모양(마을 = 흙)만, 포털 표는 그리기·안내·F 키의 번호 고르기에 쓴다. 어디로 가는지는 서버 표가 정한다(클라는 번호만 보낸다).
//   못 받으면 땅은 풀 · 포털이 안 보이고 F 키도 안 보낸다(번호를 모른다). 없다는 사실은 콘솔 경고와 data-portal 에 남는다.
const MAPS = new Map();                                                 // mapId -> {kind:'town'|'dungeon'|'instance'} — instance = 파티 전용 방 맵(땅은 던전처럼 풀)
const PORTALS = [];                                                     // {id, mapId, x, y, radius, targetMapId, name}
const portalState = { sent:0, lastFail:null };                          // 헤드리스 검증용 셈
// 맵 이동 실패 사유(P.ZONE_FAIL 이름) → 채팅 칸 [System] 문구. 존 이동 요청·포털 공통(S2C_ZONE_CHANGE_FAIL)
const ZONE_FAIL_TEXT = {
  NOT_FOUND:'갈 곳이 없습니다', FULL:'채널이 가득 찼습니다', SAME_ZONE:'이미 그 채널에 있습니다',
  NOT_ALLOWED:'다른 맵으로는 포털로만 갈 수 있습니다', TOO_FAR:'포털에 더 가까이 가세요', NO_PORTAL:'이 맵의 포털이 아닙니다',
};
// 지금 맵의 포털 중 손이 닿는 가장 가까운 것 — 서버 PortalDef::InReach 와 같은 식(거리 ≤ 반경). 맞는지는 서버가 다시 본다
function portalInReach(){
  if(!self) return null;
  let best=null, bestD=1e9;
  for(const pt of PORTALS){
    if(pt.mapId!==ZONE.mapId) continue;
    const d=Math.hypot(self.x-pt.x, self.y-pt.y);
    if(d<=pt.radius && d<bestD){ best=pt; bestD=d; }
  }
  return best;
}
function portalChanged(){ const r=portalInReach(); document.documentElement.setAttribute('data-portal', JSON.stringify({ map:ZONE.mapId, ch:ZONE.channel,
  kind:(MAPS.get(ZONE.mapId)||{}).kind||null, maps:MAPS.size, portals:PORTALS.length, here:PORTALS.filter(p=>p.mapId===ZONE.mapId).length,
  inReach:r?r.id:null, sent:portalState.sent, lastFail:portalState.lastFail })); }
// ?admin=키 — 입장 뒤 운영자 로그인을 한 번 보낸다(드랍이 생기기 전까지 가방을 채우는 /item 명령용).
const ADMIN_KEY = q.get('admin') || '';
let adminSent = false;
// 헤드리스 검증용 — 가방 요약을 속성 하나로 내놓는다(data-err·data-ready 와 같은 자리). 바뀔 때만 쓴다.
//   ★ 무기 칸(900)도 bag.slots 에 같이 담긴다(서버가 같은 칸 목록으로 보낸다) — 여기 셈에서는 가방 칸과 가른다(worn).
function bagChanged(){
  let n=0, total=0, worn=0;   // 개수 합 — 물약을 쓰면 칸 수는 그대로이고 이것만 준다
  bag.slots.forEach((e,slot)=>{ if(slot>=P.EQUIP_SLOT.WEAPON) worn++; else { n++; total+=e.c; } });
  document.documentElement.setAttribute('data-bag', JSON.stringify({ open:bag.open, tab:bag.tab, n, total, worn, items:ITEMS.size, sheet:!!ITEM_SHEET }));
  statsChanged();   // 무기 칸이 바뀌면 상태창 요약도 바뀐다
}
// 상태창 (USE_COMBAT · USE_EQUIP) — C 키로 열고 닫는다. 값은 me(레벨·공격·방어) · self(체력·마력) · bag.slots 900(무기 칸).
const stw = { open:false, hover:false };

const stat = { count:{}, rate:{}, bytes:0, kbps:0, connected:false };
function bump(name,n){ stat.count[name]=(stat.count[name]||0)+(n===undefined?1:n); }
setInterval(()=>{ stat.rate=stat.count; stat.count={}; stat.kbps=stat.bytes/1024; stat.bytes=0; }, 1000);

// ---- 캐릭터 외형 합성 (서버는 캐릭터 타입을 저장 안 함 → playerId에서 유도) ----
// LPC 레이어(몸/머리/바지/상의/머리카락)를 겹쳐 조합. 조합별 1회만 오프스크린에 구워 캐시 → 매 프레임은 1 draw.
const LAYER = {};                                   // name -> Image (걷기블록 576x256: up/left/down/right x 9프레임)
const MBODY=['b_light','b_olive','b_amber','b_bronze','b_brown','b_green','b_zombie'];
const MHEAD=['hd_light','hd_olive','hd_amber','hd_bronze','hd_brown','hd_green','hd_zombie']; // MBODY 와 같은 순서(피부톤 1:1)
const MHAIR=['h_plain','h_spiked','h_afro','h_bedhead','h_long','h_messy1','h_mop','h_parted'];
const MSHIRT=['t_red','t_forest','t_purple','t_yellow','t_teal','t_slate'];
const MPANTS=['l_blue','l_brown','l_charcoal','l_teal','l_navy','l_leather'];
const FBODY=['b_fem','bf_olive','bf_amber','bf_bronze'];
const FHEAD=['hd_f_light','hd_f_olive','hd_f_amber','hd_f_bronze'];                            // FBODY 와 같은 순서
const FHAIR=['hf_ponytail','hf_long','hf_braid','hf_bangslong','hf_pixie'];
const FSHIRT=['tf_teal','tf_rose','tf_purple','tf_navy'];
const FPANTS=['lf_navy','lf_rose','lf_brown','lf_teal'];
function ihash(id,n){ let x=(((id>>>0)*2654435761) ^ (n*40503))>>>0; x^=x>>>15; x=(x*2246822519)>>>0; x^=x>>>13; return x>>>0; }
function comboFor(id){ id=id>>>0;
  if(ihash(id,1)%12===0) return {key:'k', L:['b_skeleton']};                          // ~8% 스켈레톤(맨몸)
  if(ihash(id,2)%100<30){ const b=ihash(id,3)%FBODY.length,h=ihash(id,4)%FHAIR.length,s=ihash(id,5)%FSHIRT.length,p=ihash(id,6)%FPANTS.length;
    return {key:'f'+b+h+s+p, L:[FBODY[b],FHEAD[b],FPANTS[p],FSHIRT[s],FHAIR[h]]}; }    // ~30% 여성
  const b=ihash(id,3)%MBODY.length,h=ihash(id,4)%MHAIR.length,s=ihash(id,5)%MSHIRT.length,p=ihash(id,6)%MPANTS.length;
  return {key:'m'+b+h+s+p, L:[MBODY[b],MHEAD[b],MPANTS[p],MSHIRT[s],MHAIR[h]]};        // 남성
}
// 조합은 최대 2337가지(남 7×8×6×6 + 여 4×5×4×4 + 스켈레톤). 통째로(576x256=590KB) 캐시하면
// 시야를 스쳐간 사람이 쌓일수록 캔버스가 무제한 누적된다 → 방향 1줄(576x64)만 굽고 최근 사용 N개로 상한.
const SHEETC = new Map();                            // '조합키:행' -> 구운 캔버스(576x64)
const SHEET_CACHE_MAX = 256;                         // 576×64×4B ≈ 147KB × 256 ≈ 37MB 상한
function rowOf(dir){ return dir===1?0 : dir===3?1 : dir===4?3 : 2; }  // UP/LEFT/RIGHT else DOWN

// ---- 몬스터 ----
// 서버는 새 패킷을 파지 않고 CREATE 의 displayChar 에 예약값을 실어 몬스터 종류를 알린다
//   (Protocol.h DISPLAY_MONSTER_BASE). 사람은 'A'~'Z','a'~'z','0'~'9' 만 받으므로 0x20 미만이면 몬스터다.
//   시트 규격이 사람(LPC 9열)과 달라(뱀 7열) 조합 캐시와 따로 굽는다 — 종류×방향이라 몇 장뿐이다.
const MONIMG = {};                                   // kind -> Image (MON 전역에서 적재)
const DISPLAY_KIND = { 0x01:'snake', 0x02:'guryungi' };   // 0x01 = Protocol.h DISPLAY_SNAKE · 0x02 = 구렁이(보스) — 값은 몬스터 표 display 칸(Protocol.h 에는 이름 없음)
const MONSHEET = new Map();                          // 'kind:행' -> 구운 캔버스(cols*64 x 64) — 상한 불필요(종류×4장)
function monMeta(o){
  if(!(o.disp>0 && o.disp<0x20)) return null;
  const k=DISPLAY_KIND[o.disp];
  return (k && window.MON_META && MON_META[k]) ? Object.assign({kind:k}, MON_META[k]) : null;
}
function monSheetFor(meta,row){ const k=meta.kind+':'+row;
  const hit=MONSHEET.get(k); if(hit) return hit;
  const im=MONIMG[meta.kind]; if(!im) return null;
  const w=meta.cols*64, cv=document.createElement('canvas'); cv.width=w; cv.height=64;
  cv.getContext('2d').drawImage(im, 0,row*64,w,64, 0,0,w,64);
  MONSHEET.set(k,cv); return cv; }

function sheetFor(o,row){ const m=monMeta(o); if(m) return monSheetFor(m,row);
  const c=comboFor(o.id||0), k=c.key+':'+row;
  const hit=SHEETC.get(k);
  if(hit){ SHEETC.delete(k); SHEETC.set(k,hit); return hit; }                          // 재삽입 = 최근 사용 갱신
  const cv=document.createElement('canvas'); cv.width=576; cv.height=64; const cx=cv.getContext('2d');
  for(const name of c.L){ const im=LAYER[name]; if(im) cx.drawImage(im, 0,row*64,576,64, 0,0,576,64); } // z순서: 몸→머리→바지→상의→머리카락
  SHEETC.set(k,cv);
  if(SHEETC.size>SHEET_CACHE_MAX) SHEETC.delete(SHEETC.keys().next().value);           // 가장 오래 안 쓴 것부터 버림
  return cv; }
// 서버 CSectorManager::CalcSectorX/Y 와 같은 식 — 0..섹터수-1 로 가둔다(맵 끝에서 없는 섹터가 표시되지 않게)
function secIdx(v,s,len){ const n=Math.ceil(len/s); return Math.max(0, Math.min(n-1, Math.floor(v/s))); }
function sectorOf(x,y){ const s=ZONE.sectorSize; return secIdx(x,s,ZONE.mapWidth)+','+secIdx(y,s,ZONE.mapHeight); }

function onPacket(p){
  bump(p.name);                             // 패킷 이름별 개수(묶음 1개는 1로 셈)
  // 진입/이탈은 낱개·묶음 두 경로로 오므로 따로 센다 — 묶음은 안에 든 인원수만큼 더한다.
  switch(p.type){
    // 존 정보 — 접속·존 이동(요청·포털)·마을 부활마다 맨 먼저 온다. 올 때마다 옛 존의 남·땅 아이템을 비운다:
    //   옮기는 쪽은 옛 이웃의 DELETE 를 안 받는다(서버 BroadcastLeaveZone 은 남에게만 보낸다). 새 존의 것은 곧 CREATE 로 온다.
    //   「맵이 바뀌면」으로 걸면 같은 맵 채널 이동을 못 잡는다 · 첫 접속엔 비어 있어 무해하다. 내 캐릭터(self)는 안 비운다 —
    //   존 이동은 ZONE_CHANGE_OK 가 자리만 옮기고, 접속은 CREATE_MY 가 새로 만든다.
    case P.MSG.S2C_ZONE_INFO:
      clearZoneWorld();
      ZONE={mapId:p.mapId,channel:p.channelIndex,mapWidth:p.mapWidth,mapHeight:p.mapHeight,sectorSize:p.sectorSize}; portalChanged(); break;
    // 존을 옮긴 내 자리 — 체력·스탯은 안 싣는다(그대로다). 마을 부활이면 곧 RESPAWN 이 와 체력을 채우고 쓰러짐을 푼다.
    case P.MSG.S2C_ZONE_CHANGE_OK:
      if(self){ self.x=self.rx=p.x; self.y=self.ry=p.y; self.dir=p.direction; self.moveState=0; }   // rx·ry 도 — 미끄러져 가지 않고 바로(카메라는 다음 프레임이 따라온다)
      // 누른 채 넘어가도 서버와 안 어긋나게 — 서버는 새 존에 멈춰 세운 채 넣는다(CZone::EnterZoneAt). 채팅창 열 때와 같은 정리
      moving=false; keys.clear(); portalChanged(); break;
    case P.MSG.S2C_ZONE_CHANGE_FAIL:
      portalState.lastFail=p.reasonName;
      sysMsg(ZONE_FAIL_TEXT[p.reasonName] || ('이동하지 못했습니다 ('+p.reasonName+')')); portalChanged(); break;
    case P.MSG.S2C_CREATE_MY_PLAYER:
      self={id:p.playerId,x:p.x,y:p.y,dir:p.direction,moveState:0,disp:p.displayChar,color:p.colorIndex,speed:p.speed,rx:p.x,ry:p.y,...COMBAT_INIT(),hp:p.hp,maxHp:p.maxHp};
      // 운영자 로그인은 내 캐릭터가 생긴 "뒤"에 — 서버는 플레이어가 없는 세션의 패킷을 버린다.
      //   존을 넘을 때도 이 패킷이 다시 오지만 한 접속에 한 번만 보낸다(운영자 표시는 서버 플레이어에 남는다).
      if(ADMIN_KEY && !adminSent && ws && ws.readyState===1){ ws.send(P.enc.adminLogin(ADMIN_KEY)); adminSent=true; }
      break;
    // spawnReason 3(SPAWN) = 월드에 새로 생김 — 뱀이 깔릴 때. 부활 섬광을 같이 그린다
    case P.MSG.S2C_CREATE_OTHER_PLAYER: bump('ENTER'); fading.delete(p.playerId);   // 흐려지던 같은 번호가 다시 보이면 흐림을 버린다
      others.set(p.playerId,{x:p.x,y:p.y,dir:p.direction,moveState:p.moveState,speed:p.speed||30,disp:p.displayChar,color:p.colorIndex,rx:p.x,ry:p.y,chat:null,chatT:0,...COMBAT_INIT(),hp:p.hp,maxHp:p.maxHp,spawnT:p.spawnReason===3?SPAWN_LIFE:0}); break;
    case P.MSG.S2C_CREATE_PLAYER_BATCH: bump('ENTER', p.count);
      p.entries.forEach(e=>fading.delete(e.playerId));
      p.entries.forEach(e=>others.set(e.playerId,{x:e.x,y:e.y,dir:e.direction,moveState:e.moveState,speed:e.speed||30,disp:e.displayChar,color:e.colorIndex,rx:e.x,ry:e.y,chat:null,chatT:0,...COMBAT_INIT(),hp:e.hp,maxHp:e.maxHp,spawnT:e.spawnReason===3?SPAWN_LIFE:0})); break;
    case P.MSG.S2C_DELETE_PLAYER: bump('LEAVE'); removeOther(p.playerId); break;
    case P.MSG.S2C_DELETE_PLAYER_BATCH: bump('LEAVE', p.count); p.entries.forEach(e=>removeOther(e.playerId)); break;
    case P.MSG.S2C_SECTOR_UPDATES:
      p.entries.forEach(e=>{
        if(self && e.playerId===self.id){ self.x=e.x; self.y=e.y; self.dir=e.direction; self.moveState=e.moveState; }
        else { const o=others.get(e.playerId); if(o){ o.x=e.x; o.y=e.y; o.dir=e.direction; o.moveState=e.moveState; } }
      }); break;
    case P.MSG.S2C_MOVE_START: case P.MSG.S2C_MOVE_STOP: {
      const o=others.get(p.playerId); if(o){ o.x=p.x; o.y=p.y; o.dir=p.direction; o.moveState=(p.type===P.MSG.S2C_MOVE_START?1:0); } break; }
    case P.MSG.S2C_SYNC_POSITION:
      if(self && p.playerId===self.id){ self.x=p.x; self.y=p.y; self.rx=p.x; self.ry=p.y; }
      else { const o=others.get(p.playerId); if(o){ o.x=p.x; o.y=p.y; } } break;
    case P.MSG.S2C_CHAT: {
      if(self && p.playerId===self.id) break;   // 내 채팅은 로컬 에코로 표시
      const txt=p.message||''; chatLog.push({disp:p.displayChar,msg:txt}); if(chatLog.length>8)chatLog.shift();
      const who = others.get(p.playerId);
      if(who){ who.chat=txt; who.chatT=BUBBLE_LIFE; }   // 캐릭터별 말풍선(밀려남 없음)
      break; }

    // ---- 전투 (USE_COMBAT) ----
    // 서버가 판정한 결과만 그린다 — 클라는 HP를 스스로 깎지 않는다(권위는 서버).
    case P.MSG.S2C_ACTOR_STATS: {
      // 체력 갱신(물약·레벨업) — 본인 것도 온다. 등장 순간의 체력은 위 CREATE 셋이 싣는다.
      const a=actorOf(p.actorId); if(a){ a.hp=p.hp; a.maxHp=p.maxHp; }
      break; }
    case P.MSG.S2C_ACTOR_MP: {
      // 마력 갱신(접속·존 이동·레벨업·스킬 소모·마력 물약) — 본인 것만 온다. 체력과 같은 한 줄(번호로 찾는다 — 내 액터를 따로 다루지 않는다)
      const a=actorOf(p.actorId); if(a){ a.mp=p.mp; a.maxMp=p.maxMp; if(a===self) statsChanged(); }
      break; }
    case P.MSG.S2C_ACTOR_BUFF: {
      // 지속 효과(걸림·되감김·만료·죽음·존 이동) — 본인 것만 온다. remainMs 0 = 풀림(칸을 지운다). 종류마다 칸 하나 — 되감김은 같은 칸을 덮는다.
      //   공격력 숫자는 뒤따르는 S2C_MY_STATS 가 준다 — 여기서 곱하지 않는다(클라는 셈하지 않는다 — 마력·체력과 같은 규칙).
      const a=actorOf(p.actorId);
      if(a){
        if(!a.buffs) a.buffs=new Map();
        if(p.remainMs>0) a.buffs.set(p.kindName, { value:p.value, until:performance.now()+p.remainMs }); else a.buffs.delete(p.kindName);
        if(a===self) skillChanged();
      }
      break; }
    case P.MSG.S2C_SKILL_COOLDOWN_REMAIN: {
      // 아직 돌고 있는 쿨타임(입장·존 이동) — 본인 것만 온다. 다시 접속하면 서버가 DB 에서 되살린 쿨타임이 여기로 처음 온다.
      //   시전 순간의 쿨타임은 지금처럼 SKILL_CAST 로 센다 — 이 장은 그 셈을 서버 값으로 맞출 뿐이다(remainMs 는 늘 1 이상).
      if(self && p.actorId===self.id){ skillReadyAt.set(p.skillId, performance.now()+p.remainMs); skillChanged(); }
      break; }
    case P.MSG.S2C_ACTOR_SPEED: {
      // 속도가 바뀌었다(지금은 운영자 /gm 켬·끔뿐) — 본인 것도 남의 것도 온다. 서버 틱 사이를 이 속도로 앞질러 그린다(advance).
      //   안 바꾸면 옛 속도로 그리다 서버 좌표에 끌려간다. 등장 순간의 속도는 CREATE 가 싣는다.
      const a=actorOf(p.actorId); if(a) a.speed=p.speed;
      break; }
    case P.MSG.S2C_ATTACK: {
      const a=actorOf(p.attackerId);
      // castSkill 을 지운다 — 뒤따르는 DAMAGE 는 일반 공격 결과다(서버가 ATTACK 을 먼저 보낸다: OnSwing → FindFrontTarget → ApplyHit)
      if(a){ a.dir=p.direction; a.swingT=SWING_LIFE; a.castSkill=0; }   // 헛스윙도 온다 — 휘두르는 호를 그린다
      break; }
    case P.MSG.S2C_DAMAGE: {
      const a=actorOf(p.targetId);
      if(a){ a.hp=p.remainHp; a.hitT=HIT_LIFE; a.hitDmg=p.damage; }
      // 때린 쪽이 방금 스킬을 썼으면 스킬에 맞은 것 — 발밑에 표시한다(아래 S2C_SKILL_CAST)
      const by=actorOf(p.attackerId);
      if(a && by && by.castSkill) a.skillHitT=SKILL_HIT_LIFE;
      break; }
    case P.MSG.S2C_DEATH: {
      const a=actorOf(p.targetId);
      if(a){ a.dead=true; a.hp=0; a.moveState=0; }
      break; }
    case P.MSG.S2C_RESPAWN: {
      const a=actorOf(p.targetId);
      if(a){ a.dead=false; a.hp=p.hp; a.x=p.x; a.y=p.y; a.rx=p.x; a.ry=p.y; a.moveState=0; a.spawnT=SPAWN_LIFE; }
      break; }

    // ---- 스킬 (USE_SKILL) ----
    // 시전은 주변 방송이다 — 누구의 시전이든 받는다. 쿨타임은 내 것만 센다(서버가 안 보낸다).
    //   맞은 결과(DAMAGE·DEATH …)는 일반 공격과 같은 패킷으로 따로 온다 — 시전자 체력 소모는 ACTOR_STATS 가 곧 뒤따른다.
    //   누가 맞았는지는 SKILL_CAST 에 없다 — 시전자에 castSkill 을 걸어 두고, 뒤따르는 DAMAGE 의 때린 쪽으로 알아본다.
    //   칸 깔기는 대상 종류로 갈린다 —
    //     front: 서버가 고른다(1.5칸 안 앞쪽 반원에서 가장 가까운 하나). 화면이 칸을 짐작해 칠하면 판정과 어긋나 안 깐다(맞은 상대 고리만).
    //     shape: 서버와 같은 표의 칸 목록이라 짐작이 아니다 — 시전자 기준(앞, 옆)으로 칸을 깐다(어검술 역삼각형 4칸). 맞은 상대 고리는 그대로.
    //     self: 맞는 상대가 없다(자기 자신) — 시전자 발밑에 푸른 고리를 잠깐. castSkill 은 안 건다(뒤따르는 DAMAGE 가 없다 — 효과는 ACTOR_BUFF 로 온다).
    case P.MSG.S2C_SKILL_CAST: {
      const a=actorOf(p.casterId);
      const s=SKILLS.get(p.skillId);
      if(a){
        const selfCast = !!(s && s.target==='self');
        a.dir=p.direction; a.castSkill=selfCast ? 0 : p.skillId;
        a.castCells=null; a.castSelf=false;
        if(s && s.target==='shape' && s.shape.length){ a.castT=CAST_LIFE; a.castCells=s.shape; }
        else if(selfCast){ a.castT=CAST_LIFE; a.castSelf=true; }
      }
      if(self && p.casterId===self.id){
        skillReadyAt.set(p.skillId, performance.now()+(s?s.cooldownMs:0));
        skillState.casts++; skillChanged();
      }
      break; }
    case P.MSG.S2C_SKILL_FAIL: {
      const s=SKILLS.get(p.skillId);
      sysMsg((s?s.name+': ':'')+(SKILL_FAIL_TEXT[p.reasonName] || ('쓰지 못했습니다 ('+p.reasonName+')')));
      skillState.lastFail=p.reasonName; skillChanged();
      break; }

    // ---- 경험치·레벨 (USE_EXP) ----
    // 본인에게만 온다 — actorId 가 안 실려 있고, 실을 이유도 없다.
    //   nextLevelExp===0 은 만렙. 그때 비율을 계산하면 0 으로 나눈다.
    case P.MSG.S2C_EXP: {
      if(me.level!==null && p.level>me.level) me.levelUpT=LEVELUP_LIFE;
      me.level=p.level; me.exp=p.exp; me.base=p.levelBaseExp; me.next=p.nextLevelExp;
      break; }

    // ---- 인벤토리 (USE_INVENTORY) ----
    // 전체 목록은 입장 때 한 번(빈 가방이어도 온다) — 판을 통째로 갈아 끼운다. 칸 갱신은 그 칸의 최종값이다.
    case P.MSG.S2C_INVENTORY:
      bag.slots.clear(); p.entries.forEach(e=>bag.slots.set(e.slot,{id:e.itemId,c:e.count})); bagChanged(); break;
    case P.MSG.S2C_INVENTORY_SLOT:
      if(p.itemId===0) bag.slots.delete(p.slot); else bag.slots.set(p.slot,{id:p.itemId,c:p.count});
      bagChanged(); break;
    // 서버 알림 — 지금은 채팅 명령의 답뿐이다(이름은 ERROR 지만 거절 사유 안내가 대부분)
    case P.MSG.S2C_ERROR: sysMsg(p.message||''); break;
    case P.MSG.S2C_ADMIN_LOGIN_OK:   sysMsg('운영자로 로그인했습니다'); break;
    case P.MSG.S2C_ADMIN_LOGIN_FAIL: sysMsg('운영자 로그인 실패 — 주소의 ?admin= 키를 확인하세요'); break;
    // 쓰기 거절 — 성공은 따로 안 온다(칸 갱신과 S2C_ACTOR_STATS — 마력 물약이면 S2C_ACTOR_MP — 가 곧 결과다)
    case P.MSG.S2C_USE_ITEM_FAIL: sysMsg(USE_FAIL_TEXT[p.reasonName] || ('쓰지 못했습니다 ('+p.reasonName+')')); break;

    // ---- 스탯·장착 (USE_COMBAT · USE_EQUIP) ----
    // 내 최종 공격력·방어력 — 입장·레벨업·끼우기·빼기 때 온다. 끼우기 성공은 따로 안 온다(칸 갱신 둘 + 이 한 장이 곧 결과다)
    case P.MSG.S2C_MY_STATS: me.attack=p.attack; me.defense=p.defense; statsChanged(); break;
    case P.MSG.S2C_EQUIP_FAIL: sysMsg(EQUIP_FAIL_TEXT[p.reasonName] || ('바꾸지 못했습니다 ('+p.reasonName+')')); break;

    // ---- 땅의 아이템 (USE_DROP) ----
    case P.MSG.S2C_GROUND_ITEM_CREATE:
      ground.set(p.groundId, { itemId:p.itemId, count:p.count, x:p.x, y:p.y, dropT: p.reasonName==='DROP' ? DROP_POP : 0 });
      groundChanged(); break;
    case P.MSG.S2C_GROUND_ITEM_DELETE: {
      // 내가 주웠으면 한 줄 — 무엇을 몇 개인지는 내 땅 목록이 안다(서버는 성공 알림을 따로 안 보낸다, 칸 패킷이 곧 결과)
      const g=ground.get(p.groundId);
      if(g && p.reasonName==='PICKED' && self && p.pickerId===self.id) sysMsg(itemName(g.itemId)+(g.count>1?' ×'+g.count:'')+' 주움');
      ground.delete(p.groundId); groundChanged(); break; }
    case P.MSG.S2C_PICKUP_FAIL:
      if(p.reasonName==='TAB_FULL'){ const it=ITEMS.get(p.itemId); sysMsg((it ? INV_TAB_NAMES[it.tab]+' 가방' : '가방')+'이 가득 찼습니다'); }
      else sysMsg(PICKUP_FAIL_TEXT[p.reasonName] || ('줍지 못했습니다 ('+p.reasonName+')'));
      break;

    // ---- 파티 (USE_PARTY) — 판정은 서버. 여기는 받은 것을 담고 그리기만 한다 ----
    // 파티 전체 — 가입·탈퇴·내보냄·넘기기·해산 때 온다. 인원 0 = 파티 없음(내가 빠졌거나 해산)
    case P.MSG.S2C_PARTY_INFO:
      party.info = p.count>0 ? { partyId:p.partyId, leaderId:p.leaderId, members:p.members } : null;
      partyChanged(); break;
    // 파티원 한 줄 — 서버가 0.5초마다 견줘 바뀐 사람만(체력·레벨·맵). 다른 맵의 파티원도 온다
    case P.MSG.S2C_PARTY_MEMBER: {
      const m=party.info && party.info.members.find(x=>x.actorId===p.actorId);
      if(m){ m.level=p.level; m.hp=p.hp; m.maxHp=p.maxHp; m.mapId=p.mapId; m.displayChar=p.displayChar; m.colorIndex=p.colorIndex; partyChanged(); }
      break; }
    // 답할 요청 — 서버가 한 번에 하나만 보낸다. 창이 뜨고 Y·N 이나 단추로 답한다
    case P.MSG.S2C_PARTY_ASK:
      party.ask={ requestId:p.requestId, kind:p.kindName, from:p.from, about:p.about, until:performance.now()+p.remainMs };
      partyChanged(); break;
    // 그 요청이 무효가 됐다(시간 지남 · 보낸 사람 처지가 바뀜) — 창을 닫는다
    case P.MSG.S2C_PARTY_ASK_END:
      if(party.ask && party.ask.requestId===p.requestId){
        party.ask=null;
        sysMsg(p.reasonName==='EXPIRED' ? '받은 파티 요청의 시간이 지났습니다' : '받은 파티 요청이 취소됐습니다');
      }
      partyChanged(); break;
    case P.MSG.S2C_PARTY_NOTICE:
      party.lastNotice=p.codeName; sysMsg(partyNoticeText(p.codeName, p.actorId)); partyChanged(); break;
  }
}
// 전투 패킷은 대상이 나일 수도 남일 수도 있다 — 한 곳에서 고른다.
//   갈래를 호출부마다 쓰면 다섯 자리 중 하나를 빠뜨리기 쉽다.
function actorOf(id){
  if(self && id===self.id) return self;
  return others.get(id) || null;
}

// ---- input: drive MY avatar on the real server (WASD / arrows) ----
const keys=new Set(); let lastDir=P.DIR.DOWN, moving=false;
function curDir(){
  if(keys.has('w')||keys.has('arrowup')) return P.DIR.UP;
  if(keys.has('s')||keys.has('arrowdown')) return P.DIR.DOWN;
  if(keys.has('a')||keys.has('arrowleft')) return P.DIR.LEFT;
  if(keys.has('d')||keys.has('arrowright')) return P.DIR.RIGHT;
  return 0;
}
function sendMove(){
  if(!self || !ws || ws.readyState!==1) return;
  const d=curDir();
  if(d!==0){ lastDir=d; moving=true; self.dir=d; self.moveState=1;   // 로컬 즉시 예측(반응성)
    ws.send(P.enc.moveStart(d, self.x, self.y)); }
  else if(moving){ moving=false; self.moveState=0; ws.send(P.enc.moveStop(lastDir, self.x, self.y)); }
}
// 스페이스 = 공격. 쿨타임(서버 0.48초)은 서버가 막으므로 클라는 누른 만큼 보낸다 —
//   막힌 건 mmo_attacks_rejected_total{reason="cooldown"} 으로 세진다.
//   눌러 두면 브라우저가 키 반복을 보내므로 e.repeat 로 자동 연타만 거른다.
function sendAttack(){
  if(!self || !ws || ws.readyState!==1) return;
  if(self.dead) return;                       // 시체는 못 때린다 (서버도 dead_self 로 막지만 헛 요청을 줄인다)
  ws.send(P.enc.attack());
}
// 숫자 키 = 스킬(키 번호 = 스킬 번호). 쿨타임·대상·체력은 서버가 본다 — 클라는 누른 만큼 보낸다(일반 공격과 같다).
//   쓰러져 있어도 보낸다 — 막힌 까닭은 서버가 SKILL_FAIL 로 답해 [System] 한 줄로 뜬다(줍기와 같은 꼴)
function sendSkill(id){
  if(!self || !ws || ws.readyState!==1) return;
  ws.send(P.enc.useSkill(id));
}
// 포털 — 손이 닿는 지금 맵 포털 하나(가장 가까운 것)의 번호를 보낸다. 맞는지(같은 맵·반경)는 서버가 다시 본다 —
//   어긋나면 FAIL 4·5 가 [System] 한 줄로 온다. 닿는 포털이 없으면 안 보낸다(고를 번호가 없다 — 안내가 안 뜬 자리다).
//   쓰러져 있으면 안 보낸다 — 서버가 답 없이 버린다(존 이동 요청과 같다). 마을 부활이 곧 옮겨 준다.
function usePortal(){
  if(!self || !ws || ws.readyState!==1 || self.dead) return;
  const pt=portalInReach(); if(!pt) return;
  ws.send(P.enc.portalUse(pt.id)); portalState.sent++; portalChanged();
}
// 파티 — 보내기만 한다. 되는지(파티장만 · 인원 · 바쁨)는 서버가 가르고, 안 되면 사유가 [System] 으로 온다(클라가 미리 거르지 않는다 — 판정을 두 곳에 두면 어긋난다)
function partySend(buf){ if(!ws || ws.readyState!==1 || !self) return false; ws.send(buf); party.sent++; partyChanged(); return true; }
// 받은 요청에 답 — 보내고 창을 닫는다(서버가 답을 받으면 결과는 INFO·NOTICE 로 온다)
function partyAnswer(accept){
  if(!party.ask) return;
  if(partySend(P.enc.partyAnswer(party.ask.requestId, accept))){ party.ask=null; partyChanged(); }
}
// 줍기 — 쓰러져 있어도 보낸다(서버가 DEAD 로 답해 [System] 한 줄이 뜬다 — 왜 안 되는지 보이게)
function sendPickup(){
  if(!self || !ws || ws.readyState!==1) return;
  ws.send(P.enc.pickup());
}
if(!SNAP){
  addEventListener('keydown',e=>{ if(typing())return; const k=e.key.toLowerCase();
    if(k===' '||e.code==='Space'){ if(!e.repeat) sendAttack(); e.preventDefault(); return; }
    // I = 가방 열고 닫기, Esc = 닫기. 채팅 입력 중엔 위 typing() 에서 이미 빠진다
    //   e.key 가 아니라 e.code 로 본다 — 한글 입력 상태에서는 e.key 가 'ㅑ' 가 된다
    if(e.code==='KeyI' && !e.repeat){ bag.open=!bag.open; bag.hover=null; bagChanged(); e.preventDefault(); return; }
    // C = 상태창 열고 닫기 (I 와 같은 까닭으로 e.code)
    if(e.code==='KeyC' && !e.repeat){ stw.open=!stw.open; stw.hover=false; statsChanged(); e.preventDefault(); return; }
    // Z = 줍기 — 고르는 건 서버(2칸 안에서 주울 수 있는 가장 가까운 것 하나). 누르고 있어도 한 번(e.repeat 무시)
    if(e.code==='KeyZ'){ if(!e.repeat) sendPickup(); e.preventDefault(); return; }
    // F = 포털(상호작용) — 손이 닿는 포털이 있을 때만 보낸다. I·C 와 같은 까닭으로 e.code — 누르고 있어도 한 번
    if(e.code==='KeyF'){ if(!e.repeat) usePortal(); e.preventDefault(); return; }
    // 1~8 = 스킬(키 번호 = 스킬 번호). I·C 와 같은 까닭으로 e.code — 누르고 있어도 한 번
    const dg=/^Digit([1-8])$/.exec(e.code);
    if(dg){ if(!e.repeat && !isMonsterSkill(Number(dg[1]))) sendSkill(Number(dg[1])); e.preventDefault(); return; }   // 몬스터 몫 번호는 안 보낸다(보내면 서버가 BAD_SKILL 로 거절)
    // P = 파티 창(관리) 열고 닫기 (I·C 와 같은 까닭으로 e.code) — 파티가 없어도 열린다(맺는 법을 안내한다)
    if(e.code==='KeyP' && !e.repeat){ party.open=!party.open; party.hover=null; partyChanged(); e.preventDefault(); return; }
    // Y·N = 받은 파티 요청에 수락·거절 — 요청 창이 떠 있을 때만(아니면 그냥 지나간다)
    if(party.ask && (e.code==='KeyY' || e.code==='KeyN')){ if(!e.repeat) partyAnswer(e.code==='KeyY'); e.preventDefault(); return; }
    if(k==='escape' && (bag.open || stw.open || party.open || party.menu)){   // 창을 다 닫는다(받은 요청 창은 답해야 닫힌다 — N 이 거절)
      bag.open=false; bag.hover=null; stw.open=false; stw.hover=false; party.open=false; party.menu=null; party.hover=null; bagChanged(); partyChanged(); return; }
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ if(!keys.has(k)){keys.add(k); sendMove();} e.preventDefault(); }});
  addEventListener('keyup',e=>{ if(typing())return; const k=e.key.toLowerCase(); if(keys.delete(k)) sendMove(); });
  // Enter=채팅 열기, 채팅창 내 Enter=전송/Esc=취소
  addEventListener('keydown',e=>{ if(e.key==='Enter' && !typing()){ chatbox.focus(); e.preventDefault(); } });
  chatbox.addEventListener('keydown',e=>{ e.stopPropagation();
    if(e.key==='Enter'){ const t=chatbox.value.trim(); if(t)sendChat(t); chatbox.value=''; chatbox.blur(); }
    else if(e.key==='Escape'){ chatbox.value=''; chatbox.blur(); } });
  chatbox.addEventListener('focus',()=>{ if(moving && ws && ws.readyState===1){ moving=false; if(self)self.moveState=0; ws.send(P.enc.moveStop(lastDir, self?self.x:0, self?self.y:0)); } keys.clear(); });
  // 가방 창 마우스 — 창 안에서만 쓴다. 창 밖(게임 화면) 클릭은 가방이 안 다룬다 — 캐릭터를 누르면 아래 파티 메뉴가 뜬다(10-17 전엔 월드 클릭 동작이 없었다).
  //   좌표는 CSS px 그대로다(캔버스가 DPR 로 변환을 걸어 그리기도 CSS px 로 한다).
  cv.addEventListener('mousemove',e=>{ const h=bag.open ? bagHit(e.offsetX,e.offsetY) : null;
    const s=stw.open ? statusHit(e.offsetX,e.offsetY) : null;
    bag.hover = h && h.slot!==undefined ? h.slot : null; stw.hover = s==='weapon';
    const pu=partyUiHit(e.offsetX,e.offsetY);   // 파티 단추 위면 그 단추를 밝힌다
    party.hover = pu && pu.btn ? pu : null;
    cv.style.cursor = (h || s || pu) ? 'default' : ''; });
  cv.addEventListener('mouseleave',()=>{ bag.hover=null; stw.hover=false; party.hover=null; });
  // 파티 마우스 — 받은 요청 창 > 캐릭터 메뉴 > 파티 창 순서로 본다(위에 그려진 것이 먼저). 가방·상태창 위는 그쪽 몫이라 손대지 않는다.
  //   창 밖 게임 화면을 누르면 그 자리의 사람 캐릭터(나·몬스터 빼고)에 메뉴를 연다 — 10-17 전엔 창 밖 클릭이 아무 일도 안 했다(위 가방 주석).
  cv.addEventListener('mousedown',e=>{ if(e.button!==0) return;
    const x=e.offsetX, y=e.offsetY;
    const pu=partyUiHit(x,y);
    if(pu){ partyClick(pu); return; }
    if((bag.open && bagHit(x,y)) || (stw.open && statusHit(x,y))) return;
    if(x<VX || x>VX+VW || y<VY || y>VY+VH){ if(party.menu){ party.menu=null; partyChanged(); } return; }
    const id=charAt(x,y);
    party.menu = id ? { id, x, y } : null; partyChanged(); });
  cv.addEventListener('mousedown',e=>{ if(e.button!==0 || !bag.open) return;
    const h=bagHit(e.offsetX,e.offsetY); if(h && h.tab!==undefined){ bag.tab=h.tab; bag.hover=null; bagChanged(); } });
  // 두 번 누르기 = 가방 칸이면 쓰기·끼우기, 상태창 무기 칸이면 벗기. 되는지(물약·체력·대기시간·죽음·빈 칸)는 서버가 가르고,
  //   안 되면 사유가 [System] 으로 온다. 클라가 미리 거르지 않는 이유 — 판정을 두 곳에 두면 어긋난다(서버가 권위).
  //   ★ 무엇을 보낼지는 칸 번호의 구간으로만 가른다(장비 탭 칸 → C2S_EQUIP, 그 밖 → C2S_USE_ITEM) — 아이템 표를 안 본다.
  cv.addEventListener('dblclick',e=>{ if(!ws || ws.readyState!==1) return;
    if(stw.open && statusHit(e.offsetX,e.offsetY)==='weapon'){
      if(bag.slots.has(P.EQUIP_SLOT.WEAPON)) ws.send(P.enc.unequip(P.EQUIP_SLOT.WEAPON));
      return; }
    if(!bag.open) return;
    const h=bagHit(e.offsetX,e.offsetY); if(!h || h.slot===undefined || !bag.slots.has(h.slot)) return;
    ws.send(isEquipTabSlot(h.slot) ? P.enc.equip(h.slot) : P.enc.useItem(h.slot)); });
}
function sendChat(text){
  if(!ws || ws.readyState!==1 || !self) return;
  ws.send(P.enc.chat(text));
  // '/' 로 시작하면 명령이다 — 서버가 방송하지 않으므로 말풍선도 안 띄운다. 채팅 칸에만 흐리게 남긴다(답이 그 아래 붙는다)
  if(text[0]==='/'){ chatLog.push({cmd:true, msg:text}); if(chatLog.length>8)chatLog.shift(); return; }
  // 로컬 즉시 에코(서버 브로드캐스트가 발신자 자신을 포함 안 할 수 있어) — S2C_CHAT에서 내 것은 스킵해 중복 방지
  chatLog.push({disp:self.disp, msg:text}); if(chatLog.length>8)chatLog.shift();
  self.chat=text; self.chatT=BUBBLE_LIFE;
}

// ---- camera ----
const cam={x:60,y:60};
let aoiValid=0;   // 내 유효 섹터(AOI ±1 중 월드 내) 개수 — drawSectorGrid가 계산, drawHUD가 표시
const sx = wx => (wx-cam.x)*ZOOM + VX + VW/2;   // 기준점 = 게임 화면의 중심(캔버스 중심이 아니다)
const sy = wy => (wy-cam.y)*ZOOM + VY + VH/2;

// ---- decorative props (client-only eye candy, keyed to world) ----
const hash=(i,j)=>{let h=(i*73856093)^(j*19349663);h=(h^(h>>13))*1274126177;return((h^(h>>16))>>>0);};

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shadow(x,y,r,fade=1){ ctx.save(); ctx.globalAlpha=.26*fade; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(x,y,r,r*.4,0,0,7); ctx.fill(); ctx.restore(); }

// ---- 마을 그림(assets/town.js — tools/town/build.js 가 만든다) ----
//   맵 번호마다 땅 칸 번호·집·소품·나무 자리가 들어 있다. 그 맵 번호의 배치가 있으면 그 그림으로, 없으면(던전) 예전 땅·나무로 그린다.
//   town.js 가 없거나 그림이 안 실려도 멈추지 않는다 — 예전 흙 땅·나무·포털 고리로 떨어진다(콘솔 경고만).
//   크기: 원본 32px = 월드 TOWN.tile(1.5)칸 — 캐릭터(64px = 3칸)와 같은 비율
const TOWN_SPRITE = {};                 // 그림 이름 → {im, w, h, foot(발밑 줄 — 이 줄을 그 자리 y 에 맞춘다)}
let TOWN_ATLAS = null, TOWN_PORTAL = null;
const TOWN_GROUND = new Map();          // 맵 번호 → 땅 전체를 한 번 그려 둔 캔버스(처음 그릴 때 만든다)
function townMap(){ return (window.TOWN && window.TOWN.maps[ZONE.mapId]) || null; }
function loadTown(){
  const T=window.TOWN; if(!T){ console.warn('[town] assets/town.js 가 없다 — 마을을 예전 흙 땅으로 그린다'); return Promise.resolve(); }
  const img=(b64,ok)=>new Promise(res=>{ const im=new Image(); im.onload=()=>{ ok(im); res(); }; im.onerror=()=>{ console.warn('[town] 그림 로드 실패'); res(); }; im.src='data:image/png;base64,'+b64; });
  return Promise.all([
    img(T.atlas, im=>{ TOWN_ATLAS=im; }),
    img(T.portal.png, im=>{ TOWN_PORTAL=im; }),
    ...Object.entries(T.sprites).map(([n,s])=>img(s.png, im=>{ TOWN_SPRITE[n]={im, w:s.w, h:s.h, foot:s.foot}; })),
  ]);
}
function townGround(m){
  let c=TOWN_GROUND.get(ZONE.mapId); if(c) return c;
  c=document.createElement('canvas'); c.width=c.height=m.cells*32; const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  for(const row of m.layers) for(let i=0;i<row.length;i++){ const a=row[i]; if(a<0) continue;   // 층 순서대로(뒤 층이 위) · -1 = 그 층에 칸 없음
    x.drawImage(TOWN_ATLAS,(a%m.atlasCols)*32,Math.floor(a/m.atlasCols)*32,32,32,(i%m.cells)*32,Math.floor(i/m.cells)*32,32,32); }
  TOWN_GROUND.set(ZONE.mapId,c); return c;
}
// 나무·캐릭터와 같이 깊이 정렬되는 것 — 집이 커서(가로 24칸까지) 화면 밖 16칸까지 넣는다
function townProps(m){
  const hw=VW/2/ZOOM+16, hh=VH/2/ZOOM+16, out=[];
  for(const [name,x,y] of m.objects) if(Math.abs(x-cam.x)<=hw && Math.abs(y-cam.y)<=hh) out.push({x,y,kind:'town',name});
  for(const [kind,x,y,v] of m.trees) if(Math.abs(x-cam.x)<=hw && Math.abs(y-cam.y)<=hh) out.push({x,y,kind,v});
  return out;
}
function drawTownObject(pr){
  const s=TOWN_SPRITE[pr.name]; if(!s) return;
  const k=window.TOWN.tile/32*ZOOM;       // 원본 1px → 화면 px
  ctx.drawImage(s.im, sx(pr.x)-s.w*k/2, sy(pr.y)-(s.foot+1)*k, s.w*k, s.h*k);   // 발밑 줄을 y 에 · 그 아래는 그림자
}

function drawGround(){
  ctx.imageSmoothingEnabled=false;
  // 마을(맵 표 kind = town)은 흙, 그 밖(던전·표를 못 받음)은 풀 — 두 시트가 같은 꼴(96×192, 아래 칸이 채움 무늬)이라 칸 자리를 같이 쓴다
  const town=(MAPS.get(ZONE.mapId)||{}).kind==='town';
  const g=(town && IMG.dirt) ? IMG.dirt : IMG.grass;
  const step=2; // world units per grass cell
  const u0=Math.floor((cam.x - VW/2/ZOOM)/step)*step - step, u1=cam.x + VW/2/ZOOM + step;
  const v0=Math.floor((cam.y - VH/2/ZOOM)/step)*step - step, v1=cam.y + VH/2/ZOOM + step;
  const cell=[[32,160],[64,160],[0,160]];
  if(g) for(let u=u0;u<=u1;u+=step)for(let v=v0;v<=v1;v+=step){
    const h=hash(u/step|0,v/step|0), c=cell[h%3];
    ctx.drawImage(g,c[0],c[1],32,32, sx(u),sy(v), step*ZOOM+1, step*ZOOM+1);
  }
  // 마을 그림이 있는 맵은 그 땅을 위에 덮는다 — 예전 땅을 먼저 까는 건 맵 밖까지 보이는 창(?rows=0 등)에서 빈칸이 안 생기게
  const m=townMap();
  if(m && TOWN_ATLAS){ const size=m.cells*window.TOWN.tile*ZOOM; ctx.drawImage(townGround(m), sx(0), sy(0), size, size); }
}
function propsInView(){
  const m=townMap(); if(m) return townProps(m);   // 마을 그림이 있는 맵은 정해 둔 집·소품·나무만(저절로 깔리는 나무·바위 없음)
  const out=[]; const step=5;
  const u0=Math.floor((cam.x-VW/2/ZOOM)/step)*step-step, u1=cam.x+VW/2/ZOOM+step;
  const v0=Math.floor((cam.y-VH/2/ZOOM)/step)*step-step, v1=cam.y+VH/2/ZOOM+step;
  for(let u=u0;u<=u1;u+=step)for(let v=v0;v<=v1;v+=step){
    const h=hash((u/step|0)+900,(v/step|0)+900);
    let kind=null; if(h%11===0)kind='pine'; else if(h%11===1)kind='bush'; else if(h%23===5)kind='rock';
    if(kind) out.push({x:u+ (h%3), y:v+ (h%3), kind, v:(h>>5)&1});
  }
  return out;
}
function drawProp(pr){
  if(pr.kind==='town') return drawTownObject(pr);
  const X=sx(pr.x), Y=sy(pr.y);
  if(pr.kind==='pine') ctx.drawImage(IMG.treetop, pr.v?96:0,96,96,128, X-2.6*ZOOM, Y-3.4*ZOOM, 2.6*ZOOM*2, 3.4*ZOOM*2);
  else if(pr.kind==='bush') ctx.drawImage(IMG.treetop, pr.v?96:0,0,96,96, X-1.8*ZOOM, Y-2.2*ZOOM, 1.8*ZOOM*2, 2.2*ZOOM*2);
  else ctx.drawImage(IMG.rock, pr.v?32:0,0,32,32, X-0.9*ZOOM, Y-1.0*ZOOM, 1.8*ZOOM, 1.4*ZOOM);
}

// fade = 흐려지며 사라지는 중인 상대의 남은 비율(1 → 0, fading 참조). 그림자·몸·이름표·막대가 같이 흐려진다.
//   알파를 곱하지 않고 자리마다 값으로 넣는 이유 — 앞에서 그린 것이 알파를 1 로 안 돌려놓았어도 영향받지 않게.
function drawChar(o,isMe,t,fade=1){
  const row=rowOf(o.dir);
  const sheet=sheetFor(o, row); if(!sheet) return;
  const px=sx(o.rx), py=sy(o.ry);
  const mon=monMeta(o);
  const sc=(mon && mon.scale) || 1;   // 보스는 그림만 키운다 — 발 위치(py)는 그대로, 판정은 서버의 점
  const H0=3.0*ZOOM*sc, dw=H0, dh=H0;   // 몬스터도 같은 크기 — 시트 여백이 이미 뱀을 사람의 0.69배로 만든다
  // 걷기 프레임: 사람은 LPC 9열 중 1~8, 몬스터는 메타의 walk 목록을 돈다(뱀 0~3)
  const frame = mon
    ? (o.moveState===1 ? mon.walk[Math.floor(t*8+(o.id||0))%mon.walk.length] : mon.walk[0])
    : ((o.moveState===1)?(1+Math.floor(t*8+(o.id||0))%8):0);
  shadow(px,py,0.75*ZOOM*sc,fade);
  ctx.imageSmoothingEnabled=false;

  if(o.swingT>0) drawSwing(o,px,py);      // 휘두른 호는 캐릭터 뒤에 (앞에 두면 몸을 가린다)

  // 피격이면 붉게 물들이고 흔든다. 시체는 흐리게.
  //   점멸(알파)만으로는 정지 화면에서 맞은 티가 거의 안 났다 — 실제로 캡처해 보고 알았다.
  const hit=o.hitT>0;
  ctx.save();
  ctx.globalAlpha=(o.dead ? 0.32 : 1)*fade;
  const shake = hit ? Math.sin(o.hitT*55)*2.5 : 0;
  // 발 위치: 사람은 칸 바닥(y=62)에 발이 닿아 0.92, 뱀은 발 끝이 y=47 이라 그대로 두면 15px 뜬다 → 메타의 footAdj(0.69)
  const dx=px-dw/2+shake, dy=py-dh*(mon ? mon.footAdj : 0.92);
  if(hit && !o.dead) drawTinted(sheet, frame, dx, dy, dw, dh, 0.25+0.5*(o.hitT/HIT_LIFE));
  else ctx.drawImage(sheet, frame*64, 0, 64,64, dx, dy, dw,dh);
  ctx.restore();

  if(o.spawnT>0) drawSpawnRing(o,px,py);

  // nametag = server's authoritative display char (몬스터는 글리프가 없는 제어문자라 종류 이름을 찍는다)
  //   높이는 "머리 끝 위 같은 간격" — 사람 머리 끝은 칸 안 y=12, 몬스터는 방향(행)마다 top 이 달라
  //   그만큼 내린다(뱀은 옆을 볼 때 머리가 6px 낮다).
  const ny = mon ? dy + dh*(mon.top[row]-12)/64 - 4 : py-dh*0.92-4;
  const tag = mon ? mon.label : String.fromCharCode(o.disp||63);
  ctx.save(); ctx.globalAlpha=fade;       // 이름표·막대도 몸과 같이 흐려진다
  ctx.font='600 12px '+MONO; ctx.textAlign='center';
  const nw=ctx.measureText(tag).width+12;
  ctx.fillStyle = o.dead ? 'rgba(80,24,24,.85)' : (isMe?'rgba(40,90,60,.92)':'rgba(18,26,18,.72)');
  rr(px-nw/2,ny-14,nw,15,4); ctx.fill();
  ctx.fillStyle = o.dead ? '#f0b8b8' : (isMe?'#bff0c9':'#eaf3e0'); ctx.fillText(tag,px,ny-2.5);

  drawHpBar(o,px,ny-22);                  // 이름표 위
  ctx.restore();

  // 내 캐릭터 화살표 — HP 막대와 겹치지 않게 그 위로
  if(isMe){ const ay=ny-36+Math.sin(t*3)*3; ctx.fillStyle='#ffd84d'; ctx.strokeStyle='rgba(90,70,0,.5)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(px,ay+9); ctx.lineTo(px-6,ay); ctx.lineTo(px+6,ay); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.textAlign='left';
  drawDamage(o,px,py);                    // 숫자는 맨 위 (이름표·막대에 안 가리게)
}

// ---- 전투 표시 ----
// 피격 붉은 물들이기 — 오프스크린에 한 프레임만 그리고 source-atop 으로 색을 덮는다.
//   캔버스에 바로 덮으면 배경까지 물드므로 반드시 별도 캔버스를 거쳐야 한다.
//   시트 캐시를 한 벌 더 만들지 않는 이유 = 피격은 0.5초짜리라 캐시가 거의 적중하지 않는다.
const TINT = document.createElement('canvas'); TINT.width=64; TINT.height=64;
const tctx = TINT.getContext('2d');
function drawTinted(sheet, frame, dx, dy, dw, dh, amt){
  tctx.clearRect(0,0,64,64);
  tctx.imageSmoothingEnabled=false;
  tctx.drawImage(sheet, frame*64,0,64,64, 0,0,64,64);
  tctx.globalCompositeOperation='source-atop';          // 그려진 픽셀 위에만 색이 얹힌다
  tctx.fillStyle='rgba(255,64,48,'+Math.min(0.85,amt)+')';
  tctx.fillRect(0,0,64,64);
  tctx.globalCompositeOperation='source-over';
  ctx.drawImage(TINT, 0,0,64,64, dx,dy,dw,dh);
}
// HP 는 서버가 CREATE(등장) / S2C_ACTOR_STATS / S2C_DAMAGE 로만 준다. 값이 없으면 안 그린다 —
//   0 으로 두면 "아직 안 왔다"와 "죽었다"가 화면에서 똑같아 보인다. 전투가 꺼진 서버는 maxHp 0 을 보낸다.
function drawHpBar(o,px,y){
  if(o.hp==null || o.maxHp==null || o.maxHp<=0) return;   // == 로 undefined 도 함께 거른다
  // 폭을 월드 단위(1타일)에 맞춘다 — 고정 px 로 두면 사거리 안에서 싸울 때
  //   옆 사람 막대와 맞붙어 하나처럼 보인다(공격 사거리가 1.5타일이라 늘 붙어 싸운다).
  //   1.2타일로 뒀더니 딱 맞닿아 구분이 안 됐다 → 1타일로 줄이고 테두리를 세웠다.
  const w=Math.max(18, Math.round(1.0*ZOOM)), h=5, x=px-w/2;
  const r=Math.max(0,Math.min(1,o.hp/o.maxHp));
  ctx.fillStyle='rgba(0,0,0,.85)'; ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='rgba(28,38,28,.95)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = r>0.5 ? '#54d46e' : r>0.25 ? '#e6c24a' : '#e2574a';
  ctx.fillRect(x,y,w*r,h);
}
function drawDamage(o,px,py){
  if(o.hitT<=0 || !o.hitDmg) return;
  const k=1-o.hitT/HIT_LIFE;                       // 0 → 1 로 진행
  const y=py-3.0*ZOOM*0.92-30-k*20;                // 위로 떠오른다
  const dx=px+16;                                  // 살짝 오른쪽 — 내 캐릭터 화살표와 겹치지 않게
  ctx.save();
  ctx.globalAlpha=Math.max(0,1-k*k);
  ctx.font='700 16px '+MONO; ctx.textAlign='center';
  ctx.lineWidth=3; ctx.strokeStyle='rgba(0,0,0,.75)';
  ctx.strokeText('-'+o.hitDmg,dx,y);
  ctx.fillStyle='#ff6f5c'; ctx.fillText('-'+o.hitDmg,dx,y);
  ctx.restore(); ctx.textAlign='left';
}
function drawSwing(o,px,py){
  const k=o.swingT/SWING_LIFE;                     // 1 → 0
  const v=dvec(o.dir); if(v.x===0 && v.y===0) return;
  const cy=py-1.1*ZOOM;
  const a0=Math.atan2(v.y,v.x);
  ctx.save();
  ctx.globalAlpha=k*0.9;
  ctx.strokeStyle='#f2f7ea'; ctx.lineWidth=3.5; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(px+v.x*0.5*ZOOM, cy+v.y*0.5*ZOOM, 1.0*ZOOM, a0-0.75, a0+0.75); ctx.stroke();
  ctx.restore();
}
// 칸 하나가 덮는 자리 — 시전자 중심 기준 앞 [a0, a1) × 옆 [s0, s1). 서버 IsInShape(SkillTable.h)를 그림 좌표로 옮긴 것이다(10-15).
//   rc = 시전자 몸 반지름(castRadius). 0 이면 칸 k 는 앞 [k−0.5, k+0.5) 그대로다.
//   rc > 0 이면 서버가 앞 성분에서 rc 를 빼고 재므로 칸 k 는 [rc+k−0.5, rc+k+0.5) — 칸이 몸 가장자리부터 시작한다.
//   첫 칸(앞 1)은 몸 가장자리(rc)까지 당긴다 — 서버가 몸에 닿은 대상(뺀 앞이 0.5 미만)을 첫 칸으로 친다(IsInShape 「첫 칸 취급」).
//   그보다 안쪽(몸통 안)도 첫 칸으로 맞지만 시전자 그림 밑이라 안 깐다. 사람(반지름 0) 기준 그림이다 — 몸 큰 대상은 서버가 더 너그럽다.
function castCellSpan(f, side, rc){
  return { a0: (rc>0 && f===1) ? rc : rc+f-0.5, a1: rc+f+0.5, s0: side-0.5, s1: side+0.5 };
}
// 시전자 몸 반지름 — 몬스터만(MON_META.radius = 서버 MonsterTable.csv bodyRadius 와 같은 값. 반지름은 패킷에 없어 웹이 따로 안다). 사람은 0
function castRadius(o){ const m=monMeta(o); return (m && m.radius>0) ? m.radius : 0; }
// 범위 스킬(target=shape) 시전 칸 — 표의 칸 목록을 시전자 기준으로 잠깐 붉게 깐다(땅 층 — 맞은 상대 고리 아래).
//   칸은 [앞, 옆] — 옆은 바라보는 쪽 기준 오른쪽이 +, 오른쪽 = (−앞.y, 앞.x). 서버 칸 판정(SkillTable.h IsInShape)과 같은 기준이다.
//   시전자의 실제 좌표 기준이라 땅 타일 격자와는 반 칸 어긋날 수 있다(서버도 타일에 붙이지 않는다).
//   백호참(front)은 안 깐다 — S2C_SKILL_CAST 주석. 1단계의 앞 한 칸 깔기(25a473f)와 같은 그림을 칸 목록으로 넓힌 것이다.
//   몸이 큰 시전자(구렁이)는 칸이 몸 가장자리부터다 — 위 castCellSpan.
function drawSkillCast(o){
  const k=o.castT/CAST_LIFE;                       // 1 → 0
  const v=dvec(o.dir); if(v.x===0 && v.y===0) return;
  const rc=castRadius(o);
  ctx.save();
  for(const [f,side] of o.castCells){
    const c=castCellSpan(f,side,rc);
    // 네 귀퉁이를 땅 좌표로 — 앞 a 는 v 쪽, 옆 s 는 오른쪽 = (−앞.y, 앞.x). 방향이 넷뿐이라 땅 좌표에서도 축에 맞는 사각형이다
    const xs=[c.a0,c.a1].flatMap(a=>[c.s0,c.s1].map(s=>o.rx+v.x*a-v.y*s));
    const ys=[c.a0,c.a1].flatMap(a=>[c.s0,c.s1].map(s=>o.ry+v.y*a+v.x*s));
    const x=sx(Math.min(...xs)), y=sy(Math.min(...ys)), w=sx(Math.max(...xs))-x, h=sy(Math.max(...ys))-y;
    ctx.fillStyle='rgba(255,90,40,'+(0.6*k)+')'; ctx.fillRect(x,y,w,h);   // 0.38 은 초록 바닥과 섞여 베이지로 흐려졌다(1단계)
    ctx.strokeStyle='rgba(255,150,80,'+k+')'; ctx.lineWidth=2.5; ctx.strokeRect(x+1.25,y+1.25,w-2.5,h-2.5);
  }
  ctx.restore();
}
// 자신(target=self) 시전 — 시전자 발밑에 푸른 고리를 잠깐(땅 층 — 맞은 상대 고리와 같은 납작한 타원, 색만 다르다). 효과가 걸렸다는 신호일 뿐
//   남은 시간은 막대 칸(drawSkillBar 의 띠)이 맡는다.
function drawSelfCast(o){
  const k=o.castT/CAST_LIFE;                       // 1 → 0
  const px=sx(o.rx), py=sy(o.ry);
  const r=(0.6+0.3*(1-k))*ZOOM;                    // 0.6칸 → 0.9칸으로 퍼진다
  ctx.save();
  ctx.beginPath(); ctx.ellipse(px,py,r,r*0.45,0,0,7);
  ctx.fillStyle='rgba(80,160,255,'+(0.45*k)+')'; ctx.fill();
  ctx.strokeStyle='rgba(140,200,255,'+k+')'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}
function drawSkillCastAny(o){ if(o.castCells) drawSkillCast(o); else if(o.castSelf) drawSelfCast(o); }
function drawSkillCasts(near){
  others.forEach(o=>{ if(o.castT>0 && (o.castCells||o.castSelf) && near(o)) drawSkillCastAny(o); });
  if(self && self.castT>0 && (self.castCells||self.castSelf)) drawSkillCastAny(self);
}
// 스킬에 맞은 상대 — 발밑에 붉은 고리를 깐다(땅에 깔려 나무·캐릭터 아래). 맞는 순간부터 조금씩 퍼지며 흐려진다.
//   맞은 상대는 서버 결과(DAMAGE)로만 안다 — 예전에는 시전자 앞 한 칸을 칠했는데, 서버는 1.5칸 안 앞쪽 반원에서
//   고르므로 대각선의 뱀이 맞을 때 빈 칸이 깜빡였다(10-10 사람 확인 2번). 범위 스킬도 맞은 상대마다 이 고리가 붙는다.
//   ★ 땅에만 깐다 — 시전 칸 시절 테두리를 맨 위에 올려 봤더니 위를 보고 쏠 때 내 캐릭터 몸통을 가로질렀다(캐릭터는 위로 3칸 높이).
//     나무 밑이 나무에 가려지는 것은 캐릭터가 나무 뒤에서 가려지는 것과 같은 규칙이다(10-10 헤드리스 확대).
function drawSkillHit(o){
  const k=o.skillHitT/SKILL_HIT_LIFE;              // 1 → 0
  const px=sx(o.rx), py=sy(o.ry);
  const r=(0.55+0.3*(1-k))*ZOOM;                   // 0.55칸 → 0.85칸으로 퍼진다
  ctx.save();
  ctx.beginPath(); ctx.ellipse(px,py,r,r*0.45,0,0,7);   // 그림자(shadow)처럼 납작한 타원 — 발밑 바닥에 누운 모양
  ctx.fillStyle='rgba(255,90,40,'+(0.55*k)+')'; ctx.fill();   // 0.38 은 초록 바닥과 섞여 베이지로 흐려졌다(시전 칸 시절)
  ctx.strokeStyle='rgba(255,150,80,'+k+')'; ctx.lineWidth=2.5; ctx.stroke();
  ctx.restore();
}
function drawSkillHits(near){
  others.forEach(o=>{ if(o.skillHitT>0 && near(o)) drawSkillHit(o); });
  fading.forEach(o=>{ if(o.skillHitT>0 && near(o)) drawSkillHit(o); });   // 막타 — 맞고 죽어 지워지는 중인 상대
  if(self && self.skillHitT>0) drawSkillHit(self);
}
function drawSpawnRing(o,px,py){
  const k=1-o.spawnT/SPAWN_LIFE;                   // 0 → 1 로 퍼진다
  ctx.save();
  ctx.globalAlpha=(1-k)*0.85;
  ctx.strokeStyle='#dff6e4'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(px, py-1.0*ZOOM, 0.5*ZOOM + k*2.2*ZOOM, 0, 7); ctx.stroke();
  ctx.restore();
}
// 현재 폰트 기준 픽셀 폭에 맞게 말줄임(…) — 한글 폭 때문에 글자수 잘림은 부정확
function fitText(s, maxW){ s=s||''; if(ctx.measureText(s).width<=maxW) return s;
  let t=s; while(t.length>1 && ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1); return t+'…'; }
function drawBubble(o){
  const a=Math.max(0,Math.min(1,o.chatT/0.6));   // 마지막 0.6초만 페이드아웃
  const px=sx(o.rx), py=Math.max(VY+30, sy(o.ry)-3.0*ZOOM*0.92-18);   // 게임 화면 위쪽으로 넘치지 않게
  ctx.font='13px '+SANS; const txt=fitText(o.chat,230); const w=ctx.measureText(txt).width+20;
  ctx.globalAlpha=a; ctx.fillStyle='rgba(255,255,255,.96)'; rr(px-w/2,py-24,w,26,8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(px-6,py+1); ctx.lineTo(px+6,py+1); ctx.lineTo(px,py+9); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#20301f'; ctx.textAlign='center'; ctx.fillText(txt,px,py-6);
  ctx.globalAlpha=1; ctx.textAlign='left';
}

// ---- server-internals overlays ----
function drawSectorGrid(t){
  const s=ZONE.sectorSize;
  const u0=Math.floor((cam.x-VW/2/ZOOM)/s)*s, u1=cam.x+VW/2/ZOOM+s;
  const v0=Math.floor((cam.y-VH/2/ZOOM)/s)*s, v1=cam.y+VH/2/ZOOM+s;
  // 격자 (약간 더 진하게)
  ctx.strokeStyle='rgba(55,230,214,.24)'; ctx.lineWidth=1; ctx.beginPath();
  for(let u=u0;u<=u1;u+=s){ const p=sx(u); ctx.moveTo(p,VY); ctx.lineTo(p,VY+VH); }
  for(let v=v0;v<=v1;v+=s){ const p=sy(v); ctx.moveTo(VX,p); ctx.lineTo(VX+VW,p); }
  ctx.stroke();
  // 월드 경계
  ctx.strokeStyle='rgba(15,35,20,.6)'; ctx.lineWidth=3;
  ctx.strokeRect(sx(0),sy(0), ZONE.mapWidth*ZOOM, ZONE.mapHeight*ZOOM);
  if(!self) return;
  const cs=secIdx(self.x,s,ZONE.mapWidth), rs=secIdx(self.y,s,ZONE.mapHeight);
  // 유효 섹터: 내 AOI(±1) 중 월드 안에 실제 존재하는 셀만 하이라이트
  const nx=Math.ceil(ZONE.mapWidth/s), ny=Math.ceil(ZONE.mapHeight/s);
  aoiValid=0;
  for(let cc=cs-1;cc<=cs+1;cc++)for(let rr2=rs-1;rr2<=rs+1;rr2++){
    if(cc<0||rr2<0||cc>=nx||rr2>=ny) continue;
    aoiValid++;
    if(cc===cs&&rr2===rs) continue;             // 내 섹터는 아래서 더 밝게
    ctx.fillStyle='rgba(60,215,205,.09)'; ctx.fillRect(sx(cc*s),sy(rr2*s),s*ZOOM,s*ZOOM);
    ctx.strokeStyle='rgba(85,228,212,.45)'; ctx.lineWidth=1; ctx.strokeRect(sx(cc*s)+.5,sy(rr2*s)+.5,s*ZOOM-1,s*ZOOM-1);
  }
  // AOI 외곽 점선
  ctx.save(); ctx.setLineDash([8,6]); ctx.strokeStyle='rgba(90,232,214,.5)'; ctx.lineWidth=1.5;
  ctx.strokeRect(sx((cs-1)*s),sy((rs-1)*s),3*s*ZOOM,3*s*ZOOM); ctx.setLineDash([]); ctx.restore();
  // 내 섹터 하이라이트 (은은한 펄스 + 밝은 테두리). 라벨은 drawSectorLabels 에서 따로.
  const pulse=0.16+0.06*Math.sin((t||0)*2.2);
  ctx.fillStyle='rgba(70,235,215,'+pulse.toFixed(3)+')'; ctx.fillRect(sx(cs*s),sy(rs*s),s*ZOOM,s*ZOOM);
  ctx.strokeStyle='rgba(125,245,230,.9)'; ctx.lineWidth=2; ctx.strokeRect(sx(cs*s)+1,sy(rs*s)+1,s*ZOOM-2,s*ZOOM-2);
}
// 섹터 라벨은 격자·하이라이트(바닥)와 달리 "읽으라고" 띄운 글자다. 바닥과 같이 그리면 나무·캐릭터가
// 덮어 읽을 수 없어지므로(소나무에 '(AOI ±1)' 이 가려지는 것을 캡처로 확인), 월드 위에 따로 올린다.
function drawSectorLabels(){
  const s=ZONE.sectorSize;
  const u0=Math.floor((cam.x-VW/2/ZOOM)/s)*s, u1=cam.x+VW/2/ZOOM+s;
  const v0=Math.floor((cam.y-VH/2/ZOOM)/s)*s, v1=cam.y+VH/2/ZOOM+s;
  ctx.fillStyle='rgba(130,205,215,.32)'; ctx.font='10px '+MONO; ctx.textAlign='left';
  for(let u=u0;u<=u1;u+=s)for(let v=v0;v<=v1;v+=s){
    if(u<0||v<0||u>=ZONE.mapWidth||v>=ZONE.mapHeight) continue;
    ctx.fillText((u/s)+','+(v/s), sx(u)+4, sy(v)+13);
  }
  if(!self) return;
  const cs=secIdx(self.x,s,ZONE.mapWidth), rs=secIdx(self.y,s,ZONE.mapHeight);
  ctx.fillStyle='rgba(160,250,238,.95)'; ctx.font='600 11px '+MONO;
  ctx.fillText('내 섹터 '+cs+','+rs, sx(cs*s)+6, sy(rs*s)+16);
  // 화면 밖으로 밀리면 안쪽으로 붙인다 (좁은 창에서 왼쪽이 잘리던 문제)
  //   기준은 캔버스가 아니라 게임 화면이다 — 유효범위(60)가 화면(30)보다 커서 이 라벨은 늘 화면 왼쪽 위 모서리에 붙는다.
  ctx.fillStyle='rgba(120,240,225,.85)'; ctx.font='600 10px '+MONO;
  ctx.fillText('유효 섹터 '+aoiValid+'개 (AOI ±1)',
    Math.max(VX+6, sx((cs-1)*s)+6), Math.max(VY+12, sy((rs-1)*s)-6));
}
function panel(x,y,w,h){ ctx.fillStyle='rgba(10,16,12,.76)'; rr(x,y,w,h,10); ctx.fill(); ctx.strokeStyle='rgba(150,200,150,.16)'; ctx.lineWidth=1; ctx.stroke(); }
function drawHUD(){
  // player banner (top-left) — 레벨을 받기 전에는 아래 경험치 칸만큼 낮게 그린다
  const hasLv = me.level!==null;
  panel(14,14,220, hasLv?84:58);
  ctx.textAlign='left'; ctx.fillStyle='#eaf3e0'; ctx.font='600 15px '+SANS; ctx.fillText('주우진', 26, 36);
  ctx.fillStyle='rgba(180,210,180,.8)'; ctx.font='11px '+SANS;
  // 어느 맵인가 — 맵 표의 kind(마을·던전)와 채널. 표를 못 받았으면 번호만
  const mk=(MAPS.get(ZONE.mapId)||{}).kind, mapTxt = ZONE.mapId<0 ? '' : ' · '+(mk==='town'?'마을':mk==='dungeon'?'던전':'맵 '+ZONE.mapId)+(ZONE.channel?' ch'+ZONE.channel:'');
  ctx.fillText('내 캐릭터 '+(self?('· '+String.fromCharCode(self.disp)+' #'+self.id):'')+mapTxt, 26, 54);
  ctx.textAlign='right'; ctx.fillStyle='#8fd6a0'; ctx.font='600 13px '+SANS;
  ctx.fillText('시야 '+others.size+'명', 220, 36);
  ctx.fillStyle='rgba(180,210,180,.7)'; ctx.font='11px '+SANS; ctx.fillText('AOI 실시간', 220, 54); ctx.textAlign='left';

  if(hasLv){
    // 경험치 막대 — 누적 기준이라 "이 레벨에서 번 것 / 이 레벨이 요구하는 것"으로 환산해 그린다.
    //   서버가 base(현 레벨 도달치)와 next(다음 레벨 도달치)를 같이 줘서 클라가 표를 몰라도 된다.
    const maxed = me.next<=0;                       // 만렙 — 0 으로 나누지 않게 먼저 가른다
    const span  = maxed?0:(me.next-me.base);
    const ratio = (maxed||span<=0) ? 1 : Math.max(0,Math.min(1,(me.exp-me.base)/span));
    const bx=26, by=64, bw=182, bh=7;
    ctx.fillStyle='rgba(255,255,255,.10)'; rr(bx,by,bw,bh,3.5); ctx.fill();
    ctx.fillStyle= maxed?'#e7d16a':'#8fd6a0'; rr(bx,by,Math.max(2,bw*ratio),bh,3.5); ctx.fill();

    ctx.font='600 11px '+MONO; ctx.fillStyle='#cfe8c8';
    ctx.fillText('Lv.'+me.level, 26, 84);
    ctx.textAlign='right'; ctx.fillStyle='rgba(180,210,180,.75)';
    ctx.fillText(maxed?'MAX':((me.exp-me.base)+' / '+span), 208, 84);
    ctx.textAlign='left';
  }

  // 레벨업 순간만 짧게 — 막대가 0 으로 돌아가는 이유를 보여 준다.
  //   ★ 배너 옆(x=244)에 두면 안 된다 — 거기가 곧 게임 화면 왼쪽 끝이라 글자가 풀밭을 파고든다.
  //     게임 화면 위 가운데는 어느 패널과도 안 겹치고, 알림이 놓일 자리이기도 하다.
  if(me.levelUpT>0){
    const a=Math.min(1,me.levelUpT/0.5);
    ctx.save();
    ctx.globalAlpha=a; ctx.textAlign='center';
    ctx.font='700 22px '+SANS;
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)';
    ctx.strokeText('LEVEL UP!  Lv.'+me.level, VX+VW/2, VY+64);
    ctx.fillStyle='#ffe98a';
    ctx.fillText('LEVEL UP!  Lv.'+me.level, VX+VW/2, VY+64);
    ctx.restore();
  }

  // SERVER INTERNALS panel (top-right, teal = server's-eye)
  const pw=232, ph=195, px=W-14-pw, py=14;
  ctx.fillStyle='rgba(6,14,18,.8)'; rr(px,py,pw,ph,10); ctx.fill();
  ctx.strokeStyle='rgba(55,230,214,.28)'; ctx.lineWidth=1; ctx.stroke();
  ctx.fillStyle='rgba(150,245,235,.9)'; ctx.font='600 11px '+MONO; ctx.textAlign='left';
  ctx.fillText('SERVER INTERNALS · LIVE', px+12, py+18);
  ctx.strokeStyle='rgba(55,230,214,.15)'; ctx.beginPath(); ctx.moveTo(px+12,py+24); ctx.lineTo(px+pw-12,py+24); ctx.stroke();
  const r=stat.rate||{}, rows=[
    ['접속', stat.connected?'● 연결됨':'○ 끊김'],
    // 크기 셋은 작은 것부터 — 화면 < 유효범위 < 맵 이어야 한다(화면이 유효범위보다 크면 화면 끝이 빈다)
    ['화면', Math.round(VW/ZOOM)+'×'+Math.round(VH/ZOOM)+'칸'],
    ['유효범위', (ZONE.sectorSize*3)+'×'+(ZONE.sectorSize*3)+'칸'],
    ['맵', ZONE.mapWidth+'×'+ZONE.mapHeight+'칸'],
    ['내 좌표', self?('('+self.x.toFixed(1)+', '+self.y.toFixed(1)+')'):'-'],
    ['내 섹터', self?sectorOf(self.x,self.y):'-'],
    ['유효 섹터', self?(aoiValid+'개'):'-'],
    ['시야 인원', others.size+'명'],
    ['SECTOR_UPD', (r.S2C_SECTOR_UPDATES||0)+'/s'],
    ['CREATE/DEL', (r.ENTER||0)+' / '+(r.LEAVE||0)],
    ['CHAT', (r.S2C_CHAT||0)+'/s'],
    ['수신', stat.kbps.toFixed(1)+' KB/s'],
  ];
  ctx.font='11px '+MONO;
  rows.forEach((kv,i)=>{ const yy=py+42+i*13.2;
    ctx.fillStyle='rgba(120,180,200,.65)'; ctx.fillText(kv[0], px+12, yy);
    ctx.fillStyle= kv[0]==='접속'&&stat.connected?'#5fe6cf':'rgba(200,224,232,.92)';
    ctx.textAlign='right'; ctx.fillText(String(kv[1]), px+pw-12, yy); ctx.textAlign='left';
  });

  // 로컬 레이더 (우하단) — 클라는 AOI만 받으므로 "세계지도"가 아니라 내 주변만 (맵핵 방지)
  const ms=138, mx=W-14-ms, my=H-14-ms;
  panel(mx,my,ms,ms);
  ctx.save(); rr(mx+3,my+3,ms-6,ms-6,8); ctx.clip();
  ctx.fillStyle='#233a2c'; ctx.fillRect(mx+3,my+3,ms-6,ms-6);
  const cxp=mx+ms/2, cyp=my+ms/2, s=ZONE.sectorSize;
  const RANGE=s*2.5, sc=(ms-8)/(RANGE*2);          // 표시 반경(월드 단위) → px
  const ox=self?self.rx:ZONE.mapWidth/2, oy=self?self.ry:ZONE.mapHeight/2;
  // 로컬 섹터 격자
  ctx.strokeStyle='rgba(120,220,210,.16)'; ctx.lineWidth=1;
  for(let gx=Math.ceil((ox-RANGE)/s)*s; gx<=ox+RANGE; gx+=s){ const p=cxp+(gx-ox)*sc; ctx.beginPath(); ctx.moveTo(p,my+3); ctx.lineTo(p,my+ms-3); ctx.stroke(); }
  for(let gy=Math.ceil((oy-RANGE)/s)*s; gy<=oy+RANGE; gy+=s){ const p=cyp+(gy-oy)*sc; ctx.beginPath(); ctx.moveTo(mx+3,p); ctx.lineTo(mx+ms-3,p); ctx.stroke(); }
  // 내 섹터
  if(self){ const cs=secIdx(self.x,s,ZONE.mapWidth), rs=secIdx(self.y,s,ZONE.mapHeight);
    ctx.fillStyle='rgba(70,235,215,.15)'; ctx.fillRect(cxp+(cs*s-ox)*sc, cyp+(rs*s-oy)*sc, s*sc, s*sc); }
  // AOI 반경 링
  ctx.strokeStyle='rgba(90,232,214,.35)'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cxp,cyp, s*1.5*sc, 0,7); ctx.stroke(); ctx.setLineDash([]);
  // 주변 플레이어
  ctx.fillStyle='#e7d16a';
  others.forEach(o=>{ const dx=o.rx-ox, dy=o.ry-oy; if(Math.abs(dx)>RANGE||Math.abs(dy)>RANGE) return;
    ctx.fillRect(cxp+dx*sc-1.5, cyp+dy*sc-1.5, 3,3); });
  // 나
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cxp,cyp,3.2,0,7); ctx.fill();
  ctx.restore();
  ctx.fillStyle='rgba(200,230,200,.75)'; ctx.font='600 10px '+SANS; ctx.fillText('레이더 · 주변(AOI)', mx+10, my+16);

  // chat box (bottom-left) — real chat (입력창 자리 확보 위해 위로)
  // '주변' 채팅이다 — 서버가 채팅을 존 전체가 아니라 AOI(내 섹터 ±1)로만 뿌린다
  // (CGameServer::HandleChat → BroadcastAroundSector / RegisterSectorItem). '전체'로 적으면
  // 5,000명 전원 브로드캐스트로 읽혀 오히려 설계를 깎아먹는다.
  const bw=CHAT_W, bh=172, bx=14, by=H-52-bh;   // 폭은 resize() 가 왼쪽 여백에 맞춰 정한다
  panel(bx,by,bw,bh);
  ctx.fillStyle='rgba(180,225,180,.9)'; ctx.font='600 12px '+SANS; ctx.fillText('주변 채팅', bx+14, by+20);
  ctx.strokeStyle='rgba(150,200,150,.14)'; ctx.beginPath(); ctx.moveTo(bx+14,by+27); ctx.lineTo(bx+bw-14,by+27); ctx.stroke();
  ctx.font='13px '+SANS;
  for(let i=0;i<chatLog.length;i++){ const e=chatLog[i], yy=by+45+i*16;
    // 서버 알림(e.sys)·내가 친 명령(e.cmd)은 이름표 대신 표시를 달리한다 — 남의 말과 섞여 보이지 않게
    const nm = e.sys ? '[System] ' : e.cmd ? '> ' : '['+String.fromCharCode(e.disp)+'] ';
    ctx.fillStyle = e.sys ? '#ffe98a' : e.cmd ? 'rgba(180,210,180,.5)' : '#8fd6a0'; ctx.fillText(nm,bx+14,yy);
    const nmw=ctx.measureText(nm).width;
    ctx.fillStyle = e.sys ? '#f3ecd0' : e.cmd ? 'rgba(200,215,200,.6)' : '#dfeadd'; ctx.fillText(fitText(e.msg, bw-28-nmw), bx+14+nmw, yy);
  }

  drawSkillBar();   // 게임 화면 아래 가운데 — 상태창·가방 창보다 먼저(창이 겹치면 창이 위)
  if(stw.open) drawStatus();   // 채팅 패널 뒤 — 창이 좁아 채팅 자리까지 내려와도 상태창이 위에 그려진다
  drawPartyPanel();            // 상태창 아래(왼쪽) — 파티에 들면 늘, P 로 연 관리 창이면 파티가 없어도
  if(bag.open) drawBag();   // 맨 마지막 — 창이 낮아 레이더 자리까지 내려와도 가방이 위에 그려진다
  drawPartyMenu();          // 캐릭터를 눌러 연 메뉴와 받은 요청 창은 모든 창 위에 — 답을 기다리는 것이라 가리면 안 된다
  drawPartyAsk();
}

// ---- 스킬 막대 (USE_SKILL) — 게임 화면 아래 가운데. 표에 있는 스킬마다 한 칸: 키 번호 · 이름 · 쿨타임 덮개 · (지속 효과 스킬) 남은 시간 띠 ----
//   덮개 = 남은 쿨타임만큼 위에서부터 어둡게 + 남은 초. 쿨타임은 내 SKILL_CAST 를 받은 순간부터 센다(skillReadyAt).
//   띠 = 효과가 buff_<종류> 인 칸에, 그 종류가 내게 걸려 있으면 칸 아래쪽에 초록 띠(남은 시간 ÷ 표의 durationMs) + 남은 초. 값은 S2C_ACTOR_BUFF 가 준 remainMs 를
//   받은 시각부터 깎은 것(self.buffs). 덮개(위)와 자리가 달라 쿨타임 60초·지속 30초가 같이 보인다.
//   마력 막대는 스킬 칸들 왼쪽 — 둘을 한 덩어리로 가운데 맞춘다. 내 체력은 머리 위 막대가 있어 따로 두지 않는다.
const SKILL_CELL_W=68, SKILL_CELL_H=50, SKILL_GAP=8, MP_BAR_W=132;
// 자리 계산 한 곳 — 그리기와 헤드리스 시험이 같이 쓴다(bagLayout · statusLayout 과 같은 꼴).
//   마력을 한 장도 못 받았으면(스킬을 끈 서버 · 입장 직후) 마력 막대를 안 그리고 스킬 칸만 가운데 맞춘다.
function skillBarLayout(){
  const ids=playerSkillIds();   // 사람이 쓰는 줄만 — 몬스터 줄(user=monster)은 막대에 안 낸다
  const showMp=!!self && self.maxMp>0;
  const cellsW=ids.length ? ids.length*SKILL_CELL_W+(ids.length-1)*SKILL_GAP : 0;
  const w=(showMp?MP_BAR_W:0)+(showMp && ids.length?SKILL_GAP:0)+cellsW;
  const x0=Math.round(VX+VW/2-w/2), y0=Math.round(VY+VH-SKILL_CELL_H-12);
  const cx=x0+(showMp ? MP_BAR_W+(ids.length?SKILL_GAP:0) : 0);
  return { mp: showMp ? {x:x0, y:y0, w:MP_BAR_W, h:SKILL_CELL_H, bar:{x:x0+10, y:y0+30, w:MP_BAR_W-20, h:10}} : null,
           cells: ids.map((id,i)=>({id, x:cx+i*(SKILL_CELL_W+SKILL_GAP), y:y0})) };
}
// 마력 막대 — 이름 · 숫자 · 막대(남은 마력만큼 파랑). 값은 서버가 보낸 그대로(S2C_ACTOR_MP — 클라는 스스로 깎지 않는다)
function drawMpBar(m){
  panel(m.x,m.y,m.w,m.h);
  ctx.textAlign='left'; ctx.fillStyle='#9ec8ff'; ctx.font='600 12px '+SANS; ctx.fillText('마력', m.x+10, m.y+19);
  ctx.textAlign='right'; ctx.fillStyle='#eaf3e0'; ctx.font='600 12px '+MONO; ctx.fillText(self.mp+' / '+self.maxMp, m.x+m.w-10, m.y+19);
  const b=m.bar, r=Math.max(0, Math.min(1, self.mp/self.maxMp));
  ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#3d7bff'; ctx.fillRect(b.x,b.y,Math.round(b.w*r),b.h);
}
function drawSkillBar(){
  const L=skillBarLayout();
  if(L.mp) drawMpBar(L.mp);
  const now=performance.now();
  L.cells.forEach(c=>{
    const id=c.id, s=SKILLS.get(id), x=c.x, y0=c.y;
    panel(x,y0,SKILL_CELL_W,SKILL_CELL_H);
    ctx.textAlign='left'; ctx.fillStyle='#ffd84d'; ctx.font='700 12px '+MONO; ctx.fillText(String(id), x+8, y0+17);   // 키 번호 = 스킬 번호
    ctx.textAlign='center'; ctx.fillStyle='#eaf3e0'; ctx.font='600 13px '+SANS; ctx.fillText(fitText(s.name, SKILL_CELL_W-12), x+SKILL_CELL_W/2, y0+38);
    const left=(skillReadyAt.get(id)||0)-now;
    if(left>0 && s.cooldownMs>0){
      const r=Math.min(1,left/s.cooldownMs);
      ctx.save(); rr(x,y0,SKILL_CELL_W,SKILL_CELL_H,10); ctx.clip();
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(x,y0,SKILL_CELL_W,SKILL_CELL_H*r);
      ctx.restore();
      ctx.textAlign='right'; ctx.fillStyle='#ffffff'; ctx.font='700 11px '+MONO; ctx.fillText((left/1000).toFixed(1), x+SKILL_CELL_W-7, y0+17);
    }
    // 지속 효과 띠 — 이 칸의 효과 종류(buff_<종류>)가 내게 걸려 있을 때만. 덮개 뒤에 그려 쿨타임이 돌아도 보인다
    if(s.effect && s.effect.startsWith('buff_') && self && self.buffs){
      const b=self.buffs.get(s.effect.slice(5));
      const bl=b ? b.until-now : 0;
      if(b && bl>0){
        const r=s.durationMs>0 ? Math.min(1, bl/s.durationMs) : 1;
        const bh=8, by=y0+SKILL_CELL_H-bh;
        ctx.save(); rr(x,y0,SKILL_CELL_W,SKILL_CELL_H,10); ctx.clip();
        ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(x,by,SKILL_CELL_W,bh);
        ctx.fillStyle='rgba(95,211,138,.95)'; ctx.fillRect(x,by,Math.round(SKILL_CELL_W*r),bh);
        ctx.restore();
        ctx.textAlign='center'; ctx.fillStyle='#ffffff'; ctx.font='700 9px '+MONO; ctx.fillText('×'+b.value+' '+(bl/1000).toFixed(1)+'s', x+SKILL_CELL_W/2, by+7);
      }
    }
  });
  ctx.textAlign='left';
}

// ---- 가방 창 (USE_INVENTORY) — 그리기와 마우스 판정이 같은 자리 계산(bagLayout)을 쓴다 ----
//   모양은 다른 HUD 패널(panel)과 같다. 자리는 오른쪽 위 서버 패널(높이 195) 바로 아래, 같은 폭.
const BAG_W=232, BAG_CELL=36, BAG_GAP=6, BAG_COLS=5;
function bagLayout(){
  const tab=P.INV_TAB_RANGES[bag.tab], rows=Math.ceil(tab.n/BAG_COLS);
  const gridW=BAG_COLS*BAG_CELL+(BAG_COLS-1)*BAG_GAP, gridH=rows*BAG_CELL+(rows-1)*BAG_GAP;
  const pw=BAG_W, ph=66+gridH+26;
  const px=W-14-pw, py=Math.max(14, Math.min(14+195+12, H-14-ph));   // 창이 낮으면 위로 올려 화면 안에 둔다
  const tw=(pw-24-4*(INV_TAB_NAMES.length-1))/INV_TAB_NAMES.length;
  const tabs=INV_TAB_NAMES.map((_,i)=>({x:px+12+i*(tw+4), y:py+34, w:tw, h:22}));
  const gx=px+(pw-gridW)/2, gy=py+66, cells=[];
  for(let i=0;i<tab.n;i++) cells.push({x:gx+(i%BAG_COLS)*(BAG_CELL+BAG_GAP), y:gy+Math.floor(i/BAG_COLS)*(BAG_CELL+BAG_GAP), slot:tab.first+i});
  return {px,py,pw,ph,tabs,cells};
}
// 마우스가 가방 창 위면 {tab} · {slot} · {}(창 안 빈 곳), 밖이면 null
function bagHit(x,y){
  const L=bagLayout();
  if(x<L.px || x>L.px+L.pw || y<L.py || y>L.py+L.ph) return null;
  for(let i=0;i<L.tabs.length;i++){ const t=L.tabs[i]; if(x>=t.x && x<=t.x+t.w && y>=t.y && y<=t.y+t.h) return {tab:i}; }
  for(const c of L.cells){ if(x>=c.x && x<=c.x+BAG_CELL && y>=c.y && y<=c.y+BAG_CELL) return {slot:c.slot}; }
  return {};
}
// 시트의 그림은 32px 칸 안에서 작게 그려져 있다(병은 가로 8px 남짓) — 칸째 넣으면 점처럼 보인다.
//   그래서 칸마다 실제로 칠해진 영역을 한 번 재 두고, 정수 배율(1~3배)로 키워 가운데에 둔다(픽셀 그림은 정수 배율이라야 안 뭉개진다).
const ICON_BOX = new Map();   // icon -> {x,y,w,h}
function iconBox(icon){
  let b=ICON_BOX.get(icon); if(b) return b;
  b={x:0,y:0,w:32,h:32};
  try {
    const c=document.createElement('canvas'); c.width=32; c.height=32; const g=c.getContext('2d');
    g.drawImage(ITEM_SHEET,(icon%16)*32,Math.floor(icon/16)*32,32,32,0,0,32,32);
    const d=g.getImageData(0,0,32,32).data; let x0=32,y0=32,x1=-1,y1=-1;
    for(let y=0;y<32;y++) for(let x=0;x<32;x++) if(d[(y*32+x)*4+3]>16){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; }

// 아이템 한 칸 그림 — 표나 시트를 못 받았으면 번호를 회색으로 쓴다(판정은 서버라 동작은 안 막힌다)

// ---- 파티 (USE_PARTY) — 그리기와 마우스 판정이 같은 자리 계산(…Layout)을 쓴다(가방·상태창과 같은 꼴) ----
// 캐릭터 몸 상자(화면 px) — 누르기 판정. 그림(drawChar)은 칸 3배 크기지만 몸은 가운데 좁은 기둥이라 그만큼만 잡는다(발 = py)
function charBox(o){ const px=sx(o.rx), py=sy(o.ry); return { x:px-0.6*ZOOM, y:py-2.6*ZOOM, w:1.2*ZOOM, h:2.8*ZOOM }; }
// 그 자리의 사람 캐릭터(나·몬스터 빼고) — 겹치면 앞에 그려진 것(발이 아래 = ry 가 큰 것). 없으면 0
function charAt(x,y){
  let best=0, bestY=-1e9;
  others.forEach((o,id)=>{ if(monMeta(o) || !(o.disp>=0x20)) return;
    const b=charBox(o); if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h && o.ry>bestY){ best=id; bestY=o.ry; } });
  return best;
}

const PT_ROW=24, PT_TOP=30;
function partyLayout(){
  const visible = !!party.info || party.open; if(!visible) return null;
  const S=statusLayout(), px=14, py = stw.open ? S.py+S.ph+12 : S.py, pw = party.open ? 268 : ST_W;
  const ms = party.info ? party.info.members : [];
  const iLead = !!(party.info && self && party.info.leaderId===self.id);
  const rows = ms.map((m,i)=>{ const y=py+PT_TOP+8+i*PT_ROW, r={ y, m };
    if(party.open && iLead && !(self && m.actorId===self.id)){ r.leader={ x:px+pw-120, y:y-1, w:46, h:20 }; r.kick={ x:px+pw-70, y:y-1, w:58, h:20 }; }   // 「내보내기」 네 글자 — 50px 은 글자가 테두리에 닿았다(사진으로 확인)
    return r; });
  const bodyH = ms.length ? ms.length*PT_ROW : 44;   // 파티가 없으면 안내 두 줄

const inRect=(x,y,r)=>!!r && x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h;
// 마우스가 파티 UI 위면 {where, btn?, id?}, 아니면 null — 위에 그려진 것부터(요청 창 > 메뉴 > 목록·창)
function partyUiHit(x,y){
  if(party.ask){ const L=partyAskLayout(); if(inRect(x,y,L)) return { where:'ask', btn: inRect(x,y,L.accept)?'accept' : inRect(x,y,L.decline)?'decline' : null }; }
  if(party.menu){ const L=partyMenuLayout(); if(inRect(x,y,L)) return { where:'menu', btn: inRect(x,y,L.req)?'request':null }; }
  const L=partyLayout();
  if(L && inRect(x,y,{x:L.px,y:L.py,w:L.pw,h:L.ph})){
    for(const r of L.rows){ if(inRect(x,y,r.leader)) return { where:'panel', btn:'leader', id:r.m.actorId }; if(inRect(x,y,r.kick)) return { where:'panel', btn:'kick', id:r.m.actorId }; }
    if(inRect(x,y,L.btns.leave)) return { where:'panel', btn:'leave' };
    if(inRect(x,y,L.btns.disband)) return { where:'panel', btn:'disband' };
    return { where:'panel', btn:null };
  }
  return null;
}
function partyClick(h){
  switch(h.btn){
    case 'accept':  partyAnswer(true); break;
    case 'decline': partyAnswer(false); break;
    case 'request': partySend(P.enc.partyRequest(party.menu.id)); party.menu=null; partyChanged(); break;
    case 'leader':  partySend(P.enc.partyLeader(h.id)); break;
    case 'kick':    partySend(P.enc.partyKick(h.id)); break;
    case 'leave':   partySend(P.enc.partyLeave()); break;
    case 'disband': partySend(P.enc.partyDisband()); break;
    default: if(h.where!=='menu' && party.menu){ party.menu=null; partyChanged(); }   // 메뉴 밖의 창을 누르면 메뉴는 닫는다
  }

const isHover=(where,btn,id)=>!!party.hover && party.hover.where===where && party.hover.btn===btn && (id===undefined || party.hover.id===id);
