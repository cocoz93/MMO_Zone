// ---- frame ----
const dvec=d=> d===1?{x:0,y:-1}: d===2?{x:0,y:1}: d===3?{x:-1,y:0}: d===4?{x:1,y:0}:{x:0,y:0};
function advance(o,dt,k){
  // 데드레커닝: 서버 틱 사이를 방향·속도로 이어 그림(끊김 제거).
  // 서버 위치(o.x,o.y)를 속도로 전진시키고, 렌더(rx,ry)는 그 목표를 부드럽게 추종.
  // 상한은 서버 CZone::IsBlockedByWall 과 같은 mapWidth-1 (mapWidth 를 쓰면 없는 섹터가 잠깐 표시됨).
  // 서버 CZone::Tick 은 mapWidth 를 넘긴 뒤에야 mapWidth-1 로 되돌리므로, 경계에서 한 틱 정도는 서버가 더 나가 있을 수 있다.
  if(o.moveState===1){ const v=dvec(o.dir), s=o.speed||30;
    o.x=Math.max(0,Math.min(ZONE.mapWidth -1, o.x+v.x*s*dt));
    o.y=Math.max(0,Math.min(ZONE.mapHeight-1, o.y+v.y*s*dt)); }
  o.rx+=(o.x-o.rx)*k; o.ry+=(o.y-o.ry)*k;
}
function step(dt,t){
  if(self){ advance(self,dt,Math.min(1,dt*20));   // 내 캐릭터는 더 즉각적으로
    const hw=VW/2/ZOOM, hh=VH/2/ZOOM;               // 카메라를 맵 경계 안으로 클램프
    cam.x = ZONE.mapWidth  > hw*2 ? Math.max(hw, Math.min(ZONE.mapWidth -hw, self.rx)) : ZONE.mapWidth/2;
    cam.y = ZONE.mapHeight > hh*2 ? Math.max(hh, Math.min(ZONE.mapHeight-hh, self.ry)) : ZONE.mapHeight/2;
  }
  if(self){ decayCombat(self,dt); if(self.chat){ self.chatT-=dt; if(self.chatT<=0)self.chat=null; } }
  // 손이 닿는 포털이 바뀌면(걸어 들어가거나 나옴) 검증용 속성만 다시 쓴다 — 매 프레임 쓰지 않는다
  { const r=portalInReach(), id=r?r.id:null; if(id!==step.portalId){ step.portalId=id; portalChanged(); } }
  others.forEach(o=>{ advance(o,dt,Math.min(1,dt*9)); decayCombat(o,dt); if(o.chat){o.chatT-=dt; if(o.chatT<=0)o.chat=null;} });
  // 흐려지는 상대 — 다 흐려지면 뺀다. 그리던 자리로 마저 미끄러지고 막타 숫자도 마저 떠오른다
  fading.forEach((o,id)=>{ advance(o,dt,Math.min(1,dt*9)); decayCombat(o,dt); o.fadeT-=dt; if(o.fadeT<=0) fading.delete(id); });
  if(me.levelUpT>0) me.levelUpT=Math.max(0,me.levelUpT-dt);   // 레벨업 문구는 나 하나뿐이라 decayCombat 밖이다
  ground.forEach(g=>{ if(g.dropT>0) g.dropT=Math.max(0,g.dropT-dt); });   // 떨어지는 그림
}
// 땅의 아이템 — 캐릭터보다 먼저 그린다(발밑). 그림은 가방 칸과 같은 drawItemIcon, 개수가 1 보다 크면 오른쪽 아래 숫자
// 포털 — 지금 맵의 포털마다 바닥 그림(반경 크기) + 이름. 손이 닿으면 그림이 켜지고 「F 키로 이동」이 붙는다.
//   그림 = Teleporter Circle 돌 받침(assets/town.js — 0번 장 꺼짐, 1~4번 장 켜짐 회전). 못 실렸으면 첫판의 고리로 그린다.
//   두 번에 나눠 그린다 — 그림(고리)은 땅에(땅 아이템 아래), 글자는 캐릭터 뒤에 그림 아래쪽으로(포털에 선 캐릭터 몸에 이름이 가리지 않게).
function portalsInView(){
  const hw=VW/2/ZOOM+4, hh=VH/2/ZOOM+4;
  return PORTALS.filter(pt=>pt.mapId===ZONE.mapId && Math.abs(pt.x-cam.x)<=hw && Math.abs(pt.y-cam.y)<=hh);
}
function drawPortals(t){
  const reach=portalInReach();
  for(const pt of portalsInView()){
    const X=sx(pt.x), Y=sy(pt.y), R=pt.radius*ZOOM, on=(reach===pt);
    if(TOWN_PORTAL){
      const T=window.TOWN.portal, f=on ? 1+Math.floor(t*8)%(T.frames-1) : 0;   // 켜짐 = 1~4번 장을 초당 8장
      ctx.save(); ctx.imageSmoothingEnabled=true;                               // 3D 렌더 그림을 줄여 그린다 — 픽셀 그림이 아니라 부드럽게
      ctx.drawImage(TOWN_PORTAL, 0, f*T.fh, T.fw, T.fh, X-R*1.2, Y-R*0.62, R*2.4, R*1.2);
      ctx.restore();
      continue;
    }
    const pulse=0.5+0.5*Math.sin(t*3);
    ctx.save();
    ctx.beginPath(); ctx.ellipse(X,Y,R,R*0.5,0,0,Math.PI*2);
    ctx.fillStyle='rgba(120,90,255,'+(on?0.30:0.16+0.06*pulse)+')'; ctx.fill();
    ctx.strokeStyle='rgba(190,170,255,'+(on?1:0.55+0.25*pulse)+')'; ctx.lineWidth=on?3:2; ctx.stroke();
    ctx.beginPath(); ctx.ellipse(X,Y,R*0.55,R*0.275,0,0,Math.PI*2);
    ctx.strokeStyle='rgba(220,210,255,'+(on?0.9:0.4)+')'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.restore();
  }
}
function drawPortalLabels(){
  const reach=portalInReach();
  for(const pt of portalsInView()){
    const X=sx(pt.x), Y=sy(pt.y), R=pt.radius*ZOOM, on=(reach===pt);
    const y1=Y+R*0.5+16;
    ctx.save(); ctx.textAlign='center'; ctx.font='600 12px '+SANS;
    ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillText(pt.name, X+1, y1+1);
    ctx.fillStyle='#e6dcff'; ctx.fillText(pt.name, X, y1);
    if(on){
      ctx.font='700 12px '+SANS;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillText('F 키로 이동', X+1, y1+17);
      ctx.fillStyle='#fff4b0'; ctx.fillText('F 키로 이동', X, y1+16);
    }
    ctx.restore();
  }
}
function drawGroundItems(){
  const hw=VW/2/ZOOM+2, hh=VH/2/ZOOM+2;
  const box=Math.round(ZOOM*1.1);             // 캐릭터(3칸)보다 작게 — 한 칸 남짓
  ground.forEach(g=>{
    if(Math.abs(g.x-cam.x)>hw || Math.abs(g.y-cam.y)>hh) return;
    const cx=sx(g.x), cy=sy(g.y);
    const lift = g.dropT>0 ? Math.sin((1-g.dropT/DROP_POP)*Math.PI)*0.6*ZOOM : 0;   // 튀어 올랐다 내려온다
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(cx, cy+box*0.32, box*0.34, box*0.11, 0, 0, Math.PI*2); ctx.fill();
    const X=cx-box/2, Y=cy-box/2-lift;
    drawItemIcon(X, Y, box, g.itemId);
    if(g.count>1){
      ctx.font='700 '+Math.max(9,Math.round(ZOOM*0.45))+'px '+MONO; ctx.textAlign='right';
      ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillText(String(g.count), X+box+1, Y+box+1);
      ctx.fillStyle='#f4f4ec'; ctx.fillText(String(g.count), X+box, Y+box); ctx.textAlign='left';
    }
  });
}
// 전투 표시 타이머 감쇠 — 전부 한 곳에서 줄인다(자리를 나누면 하나를 빠뜨려 표시가 안 꺼진다)
function decayCombat(o,dt){
  if(o.hitT>0)   o.hitT  =Math.max(0,o.hitT-dt);
  if(o.swingT>0) o.swingT=Math.max(0,o.swingT-dt);
  if(o.spawnT>0) o.spawnT=Math.max(0,o.spawnT-dt);
  if(o.skillHitT>0) o.skillHitT=Math.max(0,o.skillHitT-dt);
  if(o.castT>0)  o.castT =Math.max(0,o.castT-dt);
}
function render(t){
  ctx.clearRect(0,0,W,H);
  // 여백(게임 화면 바깥)은 어두운 바탕으로 깔고, 월드는 게임 화면 안으로만 그린다(clip).
  const margin = VW<W || VH<H;
  if(margin){ ctx.fillStyle='#0f1913'; ctx.fillRect(0,0,W,H); }
  ctx.save(); ctx.beginPath(); ctx.rect(VX,VY,VW,VH); ctx.clip();
  drawGround();
  drawSectorGrid(t);
  drawPortals(t);      // 포털 고리 — 땅에 깔린다(땅의 아이템 아래)
  drawGroundItems();   // 땅의 아이템 — 나무·캐릭터보다 먼저(발밑에 깔린다)
  // depth-sorted props + players
  //   유효범위(60)가 화면(30)보다 넓어서 받은 캐릭터의 대부분은 화면 밖에 있다 — 화면 밖 5칸까지만 그린다
  //   (5칸 = 스프라이트 키 3칸 + 그 위의 이름표·HP 막대·화살표가 걸칠 수 있는 폭).
  const hw=VW/2/ZOOM+5, hh=VH/2/ZOOM+5;
  const near=o=>Math.abs(o.rx-cam.x)<=hw && Math.abs(o.ry-cam.y)<=hh;
  drawSkillCasts(near);   // 범위 스킬 시전 칸 — 땅에 깔린다(땅의 아이템 위, 고리·나무·캐릭터 아래)
  drawSkillHits(near);    // 스킬에 맞은 상대 발밑 고리 — 땅에 깔린다(땅의 아이템 위, 나무·캐릭터 아래)
  const view=[];
  propsInView().forEach(pr=>view.push({y:pr.y,kind:'prop',pr}));
  others.forEach((o,id)=>{ if(near(o)) view.push({y:o.ry,kind:'char',o:Object.assign(o,{id}),isMe:false,fade:1}); });
  fading.forEach((o,id)=>{ if(near(o)) view.push({y:o.ry,kind:'char',o:Object.assign(o,{id}),isMe:false,fade:o.fadeT/FADE_LIFE}); });
  if(self) view.push({y:self.ry,kind:'char',o:self,isMe:true,fade:1});
  view.sort((a,b)=>a.y-b.y);
  for(const it of view){ if(it.kind==='prop') drawProp(it.pr); else drawChar(it.o,it.isMe,t,it.fade); }
  drawPortalLabels();   // 포털 이름·안내 — 캐릭터 뒤(몸에 안 가리게), 말풍선 앞
  others.forEach(o=>{ if(o.chat && near(o)) drawBubble(o); });
  if(self && self.chat) drawBubble(self);
  // AOI vignette
  const s=ZONE.sectorSize, vcx=VX+VW/2, vcy=VY+VH/2, vg=ctx.createRadialGradient(vcx,vcy,1.4*s*ZOOM,vcx,vcy,2.6*s*ZOOM);
  vg.addColorStop(0,'rgba(18,33,22,0)'); vg.addColorStop(1,'rgba(10,18,13,.6)');
  ctx.fillStyle=vg; ctx.fillRect(VX,VY,VW,VH);
  drawSectorLabels();   // 월드 위 (나무·캐릭터에 가리지 않게), 비네트 뒤라 흐려지지도 않게
  ctx.restore();
  if(margin){ ctx.strokeStyle='rgba(150,200,150,.28)'; ctx.lineWidth=1; ctx.strokeRect(VX+.5,VY+.5,VW-1,VH-1); }   // 게임 화면 테두리
  drawHUD();
}

// ---- networking (live) ----
let ws=null;
function setConn(ok,txt){ stat.connected=ok; connEl.textContent=txt; connEl.className='conn '+(ok?'ok':'bad'); }
// 존에 딸린 것 비우기 — 남(사람·몬스터)·흐려지던 것·땅의 아이템. 존 정보(S2C_ZONE_INFO)가 올 때마다와 재접속 때 부른다.
//   새 존의 것은 입장 직후 CREATE(사람·몬스터 · 땅은 SEEN)로 다시 온다. 내 캐릭터·가방은 존에 딸린 게 아니라 여기서 안 비운다
function clearZoneWorld(){
  others.clear(); fading.clear();
  ground.clear(); groundChanged();
  if(party.menu){ party.menu=null; partyChanged(); }   // 누른 사람이 옛 존에 남았다 — 파티 자체는 존을 넘으므로 안 비운다
}
function connect(){
  clearZoneWorld(); self=null;   // 재접속 시 유령 엔티티 제거
  bag.slots.clear(); adminSent=false; bagChanged();   // 가방은 입장 때 전체 목록이 다시 온다 · 운영자 로그인도 새 접속마다
  party.info=null; party.ask=null; party.menu=null; partyChanged();   // 끊기면 서버가 파티에서 뺐다(저장 안 함) — 새 접속은 파티 없이 시작
  const re=new P.Reassembler(onPacket);
  ws=new WebSocket(WS_URL); ws.binaryType='arraybuffer';
  // 입장 요청을 먼저 보낸다 — 서버는 이걸 받아야 캐릭터를 불러온다(USE_LOGIN).
  //   이 패킷 전엔 내 캐릭터가 세상에 없으므로 S2C_CREATE_MY_PLAYER 도 안 온다.
  ws.onopen=()=>{ ws.send(P.enc.enterGame(ACCOUNT)); setConn(true,'● 실서버 연결됨 — '+WS_URL); };
  ws.onmessage=(ev)=>{ const b=ev.data; stat.bytes+=b.byteLength||b.length||0; re.push(new Uint8Array(b)); };
  ws.onerror=()=>setConn(false,'연결 오류 — 릴레이/서버 확인');
  ws.onclose=()=>{ setConn(false,'연결 끊김 — 재시도 중…'); setTimeout(connect,1500); };
}
const hb=setInterval(()=>{ if(ws&&ws.readyState===1) ws.send(P.enc.heartbeat()); }, 15000);

// ---- boot ----
function loadAssets(){
  const load=(dict,store)=>Object.keys(dict||{}).map(n=>new Promise(res=>{const im=new Image();
    im.onload=()=>{store[n]=im;res();}; im.onerror=()=>{console.warn('[asset] 로드 실패:',n); res();}; im.src=dict[n];}));
  return Promise.all([...load(window.IMG,IMG), ...load(window.LPC,LAYER), ...load(window.MON,MONIMG)]);   // 타일(IMG) + LPC 레이어(LAYER) + 몬스터(MONIMG)
}
// 조합이 쓰는 레이어가 실제로 다 실렸는지 확인. 하나라도 없으면 sheetFor 가 조용히 건너뛰어
// 그 부위가 통째로 안 그려진다(머리 레이어 누락으로 얼굴이 안 보이던 사고와 같은 형태).
function checkLayers(){
  const need=[...MBODY,...MHEAD,...MHAIR,...MSHIRT,...MPANTS,...FBODY,...FHEAD,...FHAIR,...FSHIRT,...FPANTS,'b_skeleton'];
  const miss=need.filter(n=>!LAYER[n]);
  if(miss.length) console.warn('[asset] 빠진 LPC 레이어:', miss.join(', '));
}
// 아이템 그림 시트(assets/items.js) + 아이템 표(serve.js 의 /data/ItemTable.csv). 어느 쪽이 없어도 멈추지 않는다 —
//   칸에 번호를 회색으로 쓰는 쪽으로 떨어진다(drawItemIcon). 없다는 사실은 콘솔 경고와 data-bag 에 남는다.
function loadItems(){
  const sheet = !window.ITEM_SHEET ? Promise.resolve() : new Promise(res=>{ const im=new Image();
    im.onload=()=>{ ITEM_SHEET=im; res(); }; im.onerror=()=>{ console.warn('[item] 그림 시트 로드 실패'); res(); }; im.src=window.ITEM_SHEET; });
  const table = fetch('/data/ItemTable.csv', {cache:'no-store'})
    .then(r=>r.ok ? r.text() : Promise.reject('HTTP '+r.status)).then(parseItemTable)
    .catch(e=>console.warn('[item] 아이템 표를 못 받았다 — 칸에 번호로 그린다:', e));
  return Promise.all([sheet, table]).then(bagChanged);
}
// 서버 파서(GameDataCsv)와 같은 규칙 — 빈 줄 · '#' 주석 · 첫 칸이 숫자가 아닌 줄(헤더)을 건너뛴다.
//   검사(번호 중복·쌓임 한도 등)는 서버가 기동 때 이미 했다 — 서버가 뜬 표면 여기서 다시 거를 것이 없다.
function parseItemTable(text){
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/^﻿/,'').trim();
    if(!line || line[0]==='#' || !/^\d/.test(line)) continue;
    const c=line.split(',').map(s=>s.trim());
    const tab=INV_TAB_FILE.get(c[2]);
    if(c.length<6 || tab===undefined) continue;
    // attack(7번째 칸) = 끼우면 더하는 공격력 — 보여 주기만 한다(무기 줄의 「공격력 +5」). 합은 서버가 셈한다
    // healMp(8번째 칸) = 마력 회복량(10-11) — 툴팁에만 쓴다. 쓸 수 있는지는 서버가 정한다(스킬을 끈 서버면 NOT_USABLE)
    ITEMS.set(Number(c[0]), { name:c[1], tab, maxStack:Number(c[3]), healHp:Number(c[4]), icon:Number(c[5]), attack:Number(c[6]||0), healMp:Number(c[7]||0) });
  }
}
// 스킬 표(serve.js 의 /data/SkillTable.csv) — 못 받아도 멈추지 않는다(막대만 안 그린다). 없다는 사실은 콘솔 경고와 data-skill 에 남는다.
function loadSkills(){
  return fetch('/data/SkillTable.csv', {cache:'no-store'})
    .then(r=>r.ok ? r.text() : Promise.reject('HTTP '+r.status)).then(parseSkillTable)
    .catch(e=>console.warn('[skill] 스킬 표를 못 받았다 — 스킬 막대를 안 그린다:', e))
    .then(skillChanged);
}
// 칸 위치로 읽는다 — skillId,name,target,effect,costHpPct,power,cooldownMs,costMp,shape,durationMs (서버 SkillTable.cpp 와 같은 순서).
//   걸러내는 규칙은 아이템 표와 같다(빈 줄 · '#' 주석 · 첫 칸이 숫자가 아닌 헤더). 값 검사는 서버가 기동 때 이미 했다.
//   shape(아홉째)는 「앞:옆」 을 ';' 로 이은 칸 목록 — front·self 줄은 비어 있거나 칸 자체가 없다(빈 목록).
//   durationMs(열째)는 지속 효과(buff_*) 줄만 — 막대 띠의 분모. 피해 줄은 비어 있거나 칸이 없다(0).
//   user(열한째)는 player | monster — 비거나 칸이 없으면 player. monster 줄은 표에 남겨 몬스터 시전의 칸 그림에 쓰되 막대·숫자 키에서는 뺀다(playerSkillIds).
function parseSkillTable(text){
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/^﻿/,'').trim();
    if(!line || line[0]==='#' || !/^\d/.test(line)) continue;
    const c=line.split(',').map(s=>s.trim());
    if(c.length<7) continue;
    const shape=(c[8]||'').split(';').filter(Boolean).map(cell=>cell.split(':').map(Number));
    SKILLS.set(Number(c[0]), { name:c[1], target:c[2], effect:c[3], costHpPct:Number(c[4]), power:Number(c[5]), cooldownMs:Number(c[6]), costMp:Number(c[7]||0), shape, durationMs:Number(c[9]||0), user:(c[10]||'player').toLowerCase() });
  }
}
// 맵 표·포털 표(serve.js 의 /data/MapTable.csv · PortalTable.csv) — 못 받아도 멈추지 않는다(땅은 풀 · 포털이 안 보인다).
//   걸러내는 규칙은 아이템 표와 같다(빈 줄 · '#' 주석 · 첫 칸이 숫자가 아닌 헤더). 값 검사는 서버가 기동 때 이미 했다.
function loadWorldTables(){
  const map = fetch('/data/MapTable.csv', {cache:'no-store'})
    .then(r=>r.ok ? r.text() : Promise.reject('HTTP '+r.status)).then(parseMapTable)
    .catch(e=>console.warn('[map] 맵 표를 못 받았다 — 땅을 풀로 그린다:', e));
  const portal = fetch('/data/PortalTable.csv', {cache:'no-store'})
    .then(r=>r.ok ? r.text() : Promise.reject('HTTP '+r.status)).then(parsePortalTable)
    .catch(e=>console.warn('[portal] 포털 표를 못 받았다 — 포털을 안 그리고 F 키도 안 보낸다:', e));
  return Promise.all([map, portal]).then(portalChanged);
}
function csvRows(text){
  const rows=[];
  for(const raw of text.split(/\r?\n/)){
    const line=raw.replace(/^﻿/,'').trim();
    if(!line || line[0]==='#' || !/^\d/.test(line)) continue;
    rows.push(line.split(',').map(s=>s.trim()));
  }
  return rows;
}
// 칸 위치로 읽는다 — mapId,width,height,kind,… (서버 MapTable.cpp 와 같은 순서). 땅 모양에는 kind 만 쓴다
function parseMapTable(text){ for(const c of csvRows(text)) if(c.length>=4) MAPS.set(Number(c[0]), { kind:c[3] }); }
// 칸 위치로 읽는다 — portalId,mapId,x,y,radius,targetMapId,targetX,targetY,name (서버 PortalTable.cpp 와 같은 순서)
function parsePortalTable(text){
  for(const c of csvRows(text)) if(c.length>=9)
    PORTALS.push({ id:Number(c[0]), mapId:Number(c[1]), x:Number(c[2]), y:Number(c[3]), radius:Number(c[4]), targetMapId:Number(c[5]), name:c[8] });
}
async function boot(){
  resize(); await loadAssets(); await loadTown(); checkLayers(); await loadItems(); await loadSkills(); await loadWorldTables();
  if(SNAP){
    // headless verification: load a real snapshot, render one frame, expose PNG
    // 전투 확인용 스냅샷을 따로 두려고 파일명을 열어 둔다 (?snap&file=snapshot-combat.json)
    const snap = await fetch(q.get('file') || 'snapshot.json').then(r=>r.json());
    ZONE = snap.zone || ZONE;
    // COMBAT_INIT 을 먼저 깔고 스냅샷 값으로 덮는다 — 안 깔면 hp 가 undefined 라
    //   막대 자리만 그려지고 채움이 NaN 으로 사라진다(라이브에서는 CREATE 가 깔아 준다).
    if(snap.self){ self={...COMBAT_INIT(), ...snap.self, rx:snap.self.x, ry:snap.self.y}; cam.x=self.rx; cam.y=self.ry; }
    (snap.players||[]).forEach(o=>others.set(o.id,{...COMBAT_INIT(), ...o, rx:o.x, ry:o.y, chat:null,chatT:0}));
    (snap.chats||[]).forEach((c)=>{ chatLog.push({disp:c.disp,msg:c.msg}); const o=others.get(c.id); if(o){o.chat=c.msg;o.chatT=BUBBLE_LIFE;} });
    stat.connected=true; stat.rate={S2C_SECTOR_UPDATES:24,ENTER:2,LEAVE:1,S2C_CHAT:3}; stat.kbps=6.4;
    render(1.0);
    const el=document.createElement('span'); el.setAttribute('data-png', cv.toDataURL()); document.body.appendChild(el);
    document.documentElement.setAttribute('data-ready','1');
    return;
  }
  connect();
  let last=0;
  (function frame(ts){ const t=ts/1000; let dt=last?Math.min(0.05,t-last):0; last=t; step(dt,t); render(t); requestAnimationFrame(frame); })(0);
}
window.onerror=(m,s,l,c)=>{ document.documentElement.setAttribute('data-err',(m||'')+' @L'+l+':'+c); };
if(document.readyState==='complete') boot(); else addEventListener('load',boot);
})();
</script>
</body></html>
